<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北斗·产融智航系统 · 北京银行南京分行 · V4</title>
  <link rel="stylesheet" href="css/theme.tokens.css?v=203">
  <link rel="stylesheet" href="css/components.css?v=203">
</head>
<body>
  <div class="portal">
    <!-- 主头部（红色一体）：品牌区 + 一级导航 + 用户 -->
    <header class="phead2"><div class="phead2-in">
      <div class="phead2-top">
        <div class="pbrand">
          <div class="logo-mark"><img src="assets/logo.png" alt="北京银行"></div>
          <div class="pbrand-t">
            <div class="pname">北斗·产融智航系统</div>
            <div class="pen">BOB NANJING · INDUSTRIAL FINANCE INTELLIGENCE</div>
          </div>
        </div>
        <span class="spacer"></span>
        <div class="pslogan2">洞察产业 · 链动金融</div>
        <div class="psearch2"><span class="ps2-ico">🔍</span><input id="pSearch" placeholder="搜索企业 / 项目 / 政策，或直接问 AI…" autocomplete="off"></div>
        <div class="dd">
          <div class="user-chip" id="userDd">
            <div class="avatar" id="uAv">王</div>
            <div><div class="u-name" id="uName">邓瑞忠</div><div class="u-role" id="uRole">客户经理 · 公司银行部</div></div>
            <span style="color:rgba(255,255,255,.6);font-size:10px">▾</span>
          </div>
          <div class="dd-menu" id="userMenu"></div>
        </div>
      </div>
      <nav class="pnav2" id="pnav"></nav>
    </div></header>
    <!-- 主体 -->
    <main class="pmain">
      <div class="crumb-bar" id="crumbBar"></div>
      <div id="viewRoot"></div>
    </main>
    <!-- 页脚 -->
    <footer class="pfoot">
      北京银行南京分行 · 北斗·产融智航系统 · 数据时点 2026-09-28
    </footer>
  </div>

  <!-- 弹窗 / 抽屉 / 角标 -->
  <div class="mask" id="mask"><div class="modal" id="modalBox">
    <div class="modal-head"><div class="modal-title" id="modalTitle"></div><button class="modal-x" id="modalX">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div></div>
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head"><div id="drawerTitle"></div><button class="modal-x" id="drawerX">✕</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- 脚本（顺序勿变；迭代升版时递增 ?v=） -->
  <script src="config/nav.js?v=203"></script>
  <script src="data/jxmap.js?v=203"></script>
  <script src="data/mock.js?v=203"></script>
  <script src="js/charts.js?v=203"></script>
  <script src="js/app.js?v=203"></script>
  <script src="js/views-funnel.js?v=203"></script>
  <script src="js/views-core.js?v=203"></script>
  <script src="js/views-biz.js?v=203"></script>
  <script src="js/views-visit.js?v=203"></script>
  <script src="js/views-cockpit.js?v=203"></script>
  <script src="js/views-workbench.js?v=203"></script>
  <script>APP.boot();</script>
</body>
</html>
