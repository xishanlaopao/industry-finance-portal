* { margin:0; padding:0; box-sizing:border-box; }

.mic { width:76px; height:76px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--brand-600),var(--brand-500)); color:#fff; font-size:26px; cursor:pointer; box-shadow:0 6px 20px rgba(192,32,44,.35); transition:.15s; }

    '<button class="mic" id="micBtn" onclick="toggleMic()">●</button>'+
    '<div class="rwave" id="rWave">'+'<i></i>'.repeat(14)+'</div>'+
    '<div class="rt" id="rTime">00:00</div>'+
    '<div class="rtip" id="rTip">点击录音：口述拜访过程，停止后自动转文字并整理归档<br>（录音仅在浏览器内演示，不上传）</div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="fgrid">'+
      '<div class="fitem"><label>拜访日期</label><input type="date" id="vDate" value="2026-11-04"></div>'+
      '<div class="fitem"><label>拜访方式</label><select id="vWay"><option>上门走访</option><option>视频会议</option><option>电话沟通</option></select></div>'+
      '<div class="fitem"><label>关键人</label><input id="vPeer" placeholder="张总·财务总监"></div>'+
    '</div>'+
    '<div class="fitem" style="margin:2px 0 6px"><label>交流要点（转写原文，可修改）</label>'+
    '<textarea class="tarea" id="vNote" placeholder="点击上方录音按钮，转写文字将自动填入；也可直接输入"></textarea></div>'+
    '<div id="aiOut"></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="mbtn" onclick="aiDo()">✦ AI 整理</button>'+
      '<button class="mbtn pri" onclick="saveVisit()">保存归档</button>'+
    '</div>'+
  '</div>'+
  '<div class="card"><div class="sec-t">历史纪要与协同留痕<small>'+esc(c.short)+' · '+t.log.length+' 条</small></div>'+
    t.log.map(function(l){ return '<div class="logitem"><div class="l1"><span class="tag tag-line">'+esc(l.d)+'</span><span class="lt">'+esc(l.t)+'</span><span class="ld" style="margin-left:auto">'+esc(l.by)+'</span></div><div class="lx">'+esc(l.x)+'</div></div>'; }).join('')+
  '</div>';
  return h;
}
function toggleMic(){
  var btn=$('#micBtn'), tip=$('#rTip'), tm=$('#rTime'), wave=$('#rWave');
  if (!REC.on){
    REC.on=true; REC.sec=0; btn.classList.add('rec'); wave.classList.add('on');
    tip.innerHTML='正在录音… 再次点击结束并<b style="color:var(--brand-600)"> AI 转写</b>';
    try { navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){ REC.stream=st; }).catch(function(){}); } catch(e){}
    REC.timer=setInterval(function(){ REC.sec++; tm.textContent=fmt2(Math.floor(REC.sec/60))+':'+fmt2(REC.sec%60); },1000);
  } else {
    clearInterval(REC.timer);
    if (REC.stream){ REC.stream.getTracks().forEach(function(x){x.stop();}); REC.stream=null; }
    REC.on=false; btn.classList.remove('rec'); btn.disabled=true; wave.classList.remove('on');
    tip.textContent='AI 转写中…';
    var t=task(S.selTask), c=co(t.co);
    setTimeout(function(){
      tip.textContent='AI 实时转写中…';
      var full=D.script[c.net]||D.script['新型电网']; var ta=$('#vNote'); ta.value='';
      var j=0; var iv=setInterval(function(){ ta.value=full.slice(0,j+=2);
        if(j>=full.length){ clearInterval(iv); ta.value=full;
          tip.innerHTML='转写完成（'+tm.textContent+'）· 已填入交流要点，AI 已同步整理';
          btn.disabled=false; aiDo(true); } },22);
    },300);
  }
}
function aiDo(auto){
  var t=task(S.selTask), c=co(t.co);
  var txt=$('#vNote').value.trim();
  if (!txt) { toastMsg('请先录音转写或输入交流要点'); return; }
  var prods=(c.prods&&c.prods.length?c.prods.slice(0,4):D.prodByNet[c.net])||['流动资金贷款'];
  var html='<div class="aicard"><div class="ah"><span class="aibadge">AI</span>纪要整理'+(auto?'（转写后自动生成）':'')+' · 请确认</div><div class="ab">'+
    '<b>识别需求</b>· 融资需求：'+prods[0]+'（意向明确，需测算额度）<br>· 非信贷需求：结算归集、代发工资（客户主动提及，优先落地）<br>· 潜在需求：'+prods.slice(1).join('、')+'（下次跟进）'+
    '<b>建议综合方案（前中台 + AI 协同 · 强调非信贷）</b>① 先落地非信贷服务（结算/代发/票据池）建立日常往来<br>② 按资本开支节奏出具'+prods[0]+'方案，对接政策贴息<br>③ 协同产品经理出综合服务方案（前中台联动）'+
    '<b>风险提示</b>'+(c.pos==='战略'?'战略客户同业竞争激烈，注意报价与服务时效。':'关注回款账期与资本开支节奏，避免期限错配。')+
    '</div></div>';
  $('#aiOut').innerHTML=html;
  $('#aiOut').style.animation='mFade .4s both';
  $('#aiOut').dataset.done='1';
  if (auto) toastMsg('AI 已完成转写整理');
}
function saveVisit(){
  var t=task(S.selTask), c=co(t.co);
  var note=$('#vNote').value.trim();
  if (!note) { toastMsg('请先录入交流要点'); return; }
  var aiOK=$('#aiOut').dataset.done==='1';
  var peer=$('#vPeer').value.trim()||'关键人';
  t.log.unshift({ d:'11-04', t:'访客纪要', by:user().name, x:'【'+$('#vWay').value+' · '+peer+'】'+note.slice(0,56)+'…（AI 已整理'+(aiOK?'：需求识别+综合方案（含非信贷服务）':'')+'）' });
  S._justSaved=true;
  if (t.status==='待接收') t.status='跟进中';
  toastMsg('纪要已归档 · 任务更新为「跟进中」，已同步任务跟踪与产品经理');
  renderHead(); renderBody();
  renderKpis();
  var nl=document.querySelector('.logitem'); if(nl&&S._justSaved){ nl.style.animation='mLogIn .7s both'; S._justSaved=false; }
}

/* ---------- AI 页 ---------- */
function pageAi(){
  var h='<div class="card"><div class="chat" id="chatBox">'+
    S.chat.map(function(m){ return m.q?('<div class="bub-q">'+esc(m.q)+'</div><div class="bub-a">'+m.a+(m.src?'<span class="src">来源：'+esc(m.src)+'</span>':'')+'</div>'):'<div class="bub-a">'+m.a+'</div>'; }).join('')+
  '</div>'+
  '<div class="sugs">'+D.qa.map(function(x,i){ return '<span class="sug" onclick="askAI('+i+')">'+esc(x.q)+'</span>'; }).join('')+'</div>'+
  '<div class="askrow"><input id="aiQ" placeholder="输入问题…" onkeydown="if(event.key===\'Enter\')askFree()"><button onclick="askFree()">提问</button></div></div>';
  return h;
}
function askAI(i){
  var x=D.qa[i]; S.chat.push({q:x.q,a:x.a,src:x.src}); renderBody();
  setTimeout(function(){ var b=$('#chatBox'); if (b) b.parentElement.scrollTop=1e5; var cb=$('#chatBox'); if(cb) cb.scrollIntoView({block:'end'}); },30);
}
function askFree(){
  var q=$('#aiQ').value.trim(); if(!q) return;
  var hit=null; D.qa.forEach(function(x){ if (!hit && (x.q.indexOf(q.slice(0,4))>=0||q.indexOf(x.q.slice(0,4))>=0)) hit=x; });
  S.chat.push({q:q,a:hit?hit.a:'已收到您的问题。演示环境为预置问答，建议点击下方推荐问题体验完整回答。',src:hit?hit.src:''});
  renderBody();
}

/* ---------- 我的页 ---------- */
function pageMy(){
  var u=user();
  return '<div class="card"><div class="sec-t">关于</div><div class="kvrow"><span class="k">平台</span><span class="v">产业金融协同工具 · 移动工作台</span></div>'+
  '<div class="kvrow"><span class="k">数据时点</span><span class="v">2026-11-04</span></div>'+
  '<div class="kvrow"><span class="k">功能</span><span class="v">任务列表 · 访前一页纸 · 访客纪要（语音转写+AI整理）· AI问答</span></div>'+
  '<div class="kvrow"><span class="k">说明</span><span class="v">录音转写为演示模拟（约1.5秒生成），正式环境接入语音识别服务</span></div></div>';
}
function toggleRoleSheet(){
  var mask=document.querySelector('#roleMask'), sheet=document.querySelector('#roleSheet');
  var show=sheet.style.display==='none';
  sheet.style.display=show?'block':'none'; mask.style.display=show?'block':'none';
  if(!show) return;
  sheet.innerHTML='<div style="text-align:center;font-size:11px;color:var(--t3);padding:8px 0 4px">切换角色（演示）· 工作台内容随角色变化</div>'+
    D.users.map(function(x){
      return '<div class="roleitem '+(x.id===S.role?'on':'')+'" onclick="pickRole(\''+x.id+'\')"><div class="uav2" style="width:36px;height:36px;font-size:14px;border-radius:10px">'+esc(x.av)+'</div><div><div class="rn">'+esc(x.name)+'</div><div class="rd">'+esc(x.role)+' · '+esc(x.dept)+'</div></div>'+(x.id===S.role?'<span class="tag tag-green" style="margin-left:auto">当前</span>':'')+'</div>';
    }).join('')+
    '<div class="mbtn" style="width:100%;margin-top:6px" onclick="toggleRoleSheet()">取消</div>';
}
function pickRole(r){ toggleRoleSheet(); setRole(r); }
function setRole(r){ S.role=r; var ts=myTasks(); S.selTask=ts[0]?ts[0].id:null; S.opCo=null; renderHead(); renderTab(); renderBody(); toastMsg('已切换：'+user().name+'（'+user().role+'）'); }

/* ---------- 总渲染 ---------- */
function renderBody(){
  var h='';
  if (S.tab==='task') h=pageTask();
  else if (S.tab==='op') h=pageOp();
  else if (S.tab==='visit') h=pageVisit();
  else if (S.tab==='ai') h=pageAi();
  else h=pageMy();
  $('#mBody').innerHTML=h;
  if(S.tab==='op'){ var cs=document.querySelectorAll('#mBody > *'); cs.forEach(function(e,i){ e.style.animation='mStagIn .45s both '+(i*70)+'ms'; }); }
  $('#mBody').scrollTop=0;
  var ki=document.querySelector('#tKw');
  if(ki) ki.oninput=function(){ S.kw=ki.value; renderBody(); var k2=document.querySelector('#tKw'); if(k2){ k2.focus(); k2.setSelectionRange(k2.value.length,k2.value.length);} };
}
renderHead(); renderTab(); renderBody();
</script>
