<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>北斗·产融智航系统 · 移动工作台</title>
<style>
/* ============ 设计令牌（与 PC 门户一致） ============ */
:root {
  --brand-500:#C0202C; --brand-600:#A61521; --brand-700:#8E1019; --brand-100:#FBE7E9; --brand-50:#FCF4F5;
  --blue-500:#2458F5; --blue-100:#E7EEFF;
  --ok-500:#16A34A; --ok-50:#E8F7EE; --warn-500:#F59E0B; --warn-50:#FEF4E2; --danger-500:#E5484D; --danger-50:#FDECEC;
  --info-500:#0EA5E9; --info-50:#E6F6FD; --violet-500:#7C3AED; --violet-50:#F1EAFE;
  --bg:#F5F6F8; --card:#fff; --line:#E7EAF0; --line-strong:#D5DAE4;
  --t1:#1A2233; --t2:#5A6478; --t3:#8A93A6;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --r:12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:var(--font); background:#20242B; display:flex; justify-content:center; align-items:center; }
::-webkit-scrollbar { width:0; height:0; }

/* ============ 手机壳（PC 预览） ============ */
.phone { width:100%; max-width:414px; height:min(880px,100vh); background:var(--bg); display:flex; flex-direction:column; overflow:hidden; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.5); }
@media (max-width:480px) { body { background:var(--bg); } .phone { max-width:none; height:100vh; box-shadow:none; } }

/* ============ 顶栏 ============ */
.mhead { background:linear-gradient(96deg,#7E0E19,#A61521 45%,#C0202C); color:#fff; padding:19px 16px 17px; flex-shrink:0; }
.mhead .r1 { display:flex; align-items:center; gap:8px; }
.mhead .logo { width:26px; height:26px; border-radius:7px; background:#fff; color:var(--brand-600); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
.mhead .t { font-size:15px; font-weight:700; letter-spacing:.5px; flex:1; }
.mhead .urole { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:999px; font-size:11px; padding:3px 10px; display:flex; align-items:center; gap:5px; }
.mhead .uinfo { display:flex; align-items:center; gap:9px; margin-top:10px; }
.mhead .avatar { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
.mhead .un { font-size:13px; font-weight:600; }
.mhead .ud { font-size:11px; color:#FFD9DC; margin-top:1px; }
.mhead .urole2 { display:flex; align-items:center; gap:11px; margin-top:17px; }
.mhead .uav3 { width:52px; height:52px; border-radius:14px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.mkpis { display:flex; gap:8px; padding:10px 12px 2px; }
.mkpi { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 4px 9px; text-align:center; }
.mkpi .k { font-size:10px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mkpi .v { font-size:19px; font-weight:800; color:#B02A35; margin-top:2px; line-height:1.2; font-variant-numeric:tabular-nums; }
.mkpi.alert .v { color:var(--danger-500); }
.mkpi.alert .k { color:var(--danger-500); }

/* ============ 主体 ============ */
.mbody { flex:1; overflow-y:auto; padding:12px 12px 16px; }
.mpage { display:none; }
.mpage.on { display:block; animation:fadeIn .18s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.card { background:var(--card); border-radius:var(--r); border:1px solid var(--line); padding:13px 14px; margin-bottom:10px; }
.sec-t { font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.sec-t::before { content:""; width:3.5px; height:14px; border-radius:2px; background:var(--brand-500); }
.sec-t small { font-size:10.5px; color:var(--t3); font-weight:400; margin-left:auto; }
.tag { display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:5px; font-size:10.5px; font-weight:500; white-space:nowrap; }
.tag-blue{background:var(--blue-100);color:#1A44D6} .tag-green{background:var(--ok-50);color:var(--ok-500)}
.tag-orange{background:var(--warn-50);color:#C77700} .tag-red{background:var(--danger-50);color:var(--danger-500)}
.tag-violet{background:var(--violet-50);color:var(--violet-500)} .tag-cyan{background:var(--info-50);color:#0284C7}
.tag-gray{background:#F0F2F7;color:var(--t2)} .tag-line{background:#fff;border:1px solid var(--line-strong);color:var(--t2)}
.tag-solid-red{background:var(--brand-500);color:#fff}
.muted { color:var(--t3); font-size:11px; }
.sub { color:var(--t2); font-size:12px; line-height:1.7; }
b.sm { font-size:13px; }

/* 任务卡 */
.tcard { display:flex; gap:11px; }
.tcard .tdoc { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--brand-600),var(--brand-500)); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tcard .tbody { flex:1; min-width:0; }
.tcard .tr1 { display:flex; align-items:center; gap:6px; }
.tcard .tn { font-size:14px; font-weight:700; flex:1; }
.tcard .tmeta { font-size:10.5px; color:var(--t3); margin-top:3px; }
.tcard .tlast { font-size:11px; color:var(--t2); background:#F7F9FC; border-radius:8px; padding:6px 8px; margin-top:7px; line-height:1.6; }
.tcard .tacts { display:flex; gap:8px; margin-top:8px; }
.mbtn { flex:1; height:30px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; color:var(--t2); font-size:12px; font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:4px; }
.mbtn.pri { background:var(--brand-500); border-color:var(--brand-500); color:#fff; font-weight:600; }
.mbtn.ghost-plain { flex:0 0 auto; padding:0 12px; }

/* 一页纸 */
.op-head { display:flex; gap:11px; align-items:center; }
.op-logo { width:44px; height:44px; border-radius:11px; background:linear-gradient(135deg,var(--brand-600),var(--brand-500)); color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.op-score { margin-left:auto; text-align:center; background:#FFF6F7; border:1px solid #F3D3D6; border-radius:10px; padding:4px 10px; flex-shrink:0; }
.op-score b { font-size:20px; color:var(--brand-600); display:block; line-height:1.15; }
.op-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.op-sec { margin-top:12px; }
.op-sec-t { font-size:11px; font-weight:700; color:var(--brand-600); letter-spacing:.5px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.op-sec-t::before { content:""; width:3px; height:10px; border-radius:2px; background:var(--brand-500); }
.kvrow { display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); font-size:12px; }
.kvrow:last-child { border-bottom:none; }
.kvrow .k { width:78px; color:var(--t3); flex-shrink:0; }
.kvrow .v { flex:1; color:var(--t1); line-height:1.55; }
.qitem { display:flex; gap:8px; margin-bottom:7px; }
.qn { width:17px; height:17px; border-radius:50%; background:var(--brand-500); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }

/* 录音 */
.recard { text-align:center; padding:18px 14px 14px; background:linear-gradient(160deg,#FBF4F5,#F7FAFF); border:1px solid #F0D9DC; border-radius:var(--r); margin-bottom:10px; }
.mic { width:76px; height:76px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--brand-600),var(--brand-500)); color:#fff; font-size:26px; cursor:pointer; box-shadow:0 6px 20px rgba(192,32,44,.35); transition:.15s; }
.mic:active { transform:scale(.96); }
.mic.rec { background:var(--danger-500); animation:pulse 1s infinite; }
.mic[disabled] { opacity:.6; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(229,72,77,.45); } 100% { box-shadow:0 0 0 20px rgba(229,72,77,0); } }
.rt { margin-top:10px; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
.rtip { font-size:11px; color:var(--t2); margin-top:4px; line-height:1.6; }
.rwave { display:flex; gap:3px; justify-content:center; height:22px; align-items:center; margin-top:8px; }
.rwave i { width:3px; border-radius:2px; background:var(--brand-500); height:6px; }
.rwave.on i { animation:wv 1s infinite ease-in-out; }
.rwave.on i:nth-child(2n) { animation-delay:.15s; } .rwave.on i:nth-child(3n) { animation-delay:.3s; } .rwave.on i:nth-child(4n) { animation-delay:.45s; }
@keyframes wv { 0%,100% { height:5px; } 50% { height:20px; } }
.fgrid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:10px 0; }
.fitem label { display:block; font-size:10.5px; color:var(--t3); margin-bottom:3px; }
.fitem input,.fitem select, textarea.tarea { width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:7px 9px; font-size:12px; font-family:var(--font); outline:none; background:#fff; color:var(--t1); }
.fitem input:focus,.fitem select:focus, textarea.tarea:focus { border-color:var(--brand-500); }
textarea.tarea { width:100%; min-height:88px; resize:vertical; line-height:1.7; }
.aicard { background:linear-gradient(135deg,#F5F0FF,#EEF6FF); border:1px solid #E0D9FB; border-radius:var(--r); padding:12px 13px; margin-top:10px; }
.aicard .ah { display:flex; align-items:center; gap:6px; font-weight:700; font-size:12px; color:#4C36B0; margin-bottom:6px; }
.aibadge { display:inline-flex; align-items:center; font-size:9.5px; font-weight:800; color:#fff; background:linear-gradient(135deg,#6D3BF5,#00B4FF); padding:2px 7px; border-radius:9px; letter-spacing:.5px; }
.aicard .ab { font-size:11.5px; color:#2B2350; line-height:1.8; }
.aicard .ab b { display:block; margin-top:6px; color:#1A1440; }
.logitem { padding:9px 0; border-bottom:1px dashed var(--line); }
.logitem:last-child { border-bottom:none; }
.logitem .l1 { display:flex; align-items:center; gap:6px; }
.logitem .lt { font-size:12px; font-weight:600; }
.logitem .ld { font-size:10.5px; color:var(--t3); }
.logitem .lx { font-size:11.5px; color:var(--t2); line-height:1.65; margin-top:4px; }

/* AI 问答 */
.chat { display:flex; flex-direction:column; gap:8px; padding:4px 2px 8px; }
.bub-q { align-self:flex-end; max-width:82%; background:var(--brand-500); color:#fff; border-radius:13px 13px 3px 13px; padding:9px 12px; font-size:12.5px; line-height:1.6; }
.bub-a { align-self:flex-start; max-width:90%; background:#fff; border:1px solid #E3DEFA; border-radius:13px 13px 13px 3px; padding:9px 12px; font-size:12px; line-height:1.7; color:#2B2350; box-shadow:0 1px 3px rgba(16,24,40,.05); }
.bub-a .src { display:block; margin-top:6px; font-size:10px; color:var(--t3); }
.sugs { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.sug { font-size:11px; padding:5px 10px; border-radius:999px; background:#F2F4F8; color:var(--t2); border:1px solid var(--line); }
.askrow { display:flex; gap:8px; }
.askrow input { flex:1; height:36px; border:1px solid var(--line-strong); border-radius:10px; padding:0 12px; font-size:12.5px; outline:none; font-family:var(--font); }
.askrow button { width:64px; border:none; border-radius:10px; background:var(--brand-500); color:#fff; font-size:13px; font-weight:600; font-family:var(--font); }

/* 我的 */
.ucard { display:flex; gap:12px; align-items:center; }
.uav2 { width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,#7E0E19,#C0202C); color:#fff; font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.rolelist { display:flex; flex-direction:column; gap:8px; }
.roleitem { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.roleitem.on { border-color:var(--brand-500); background:var(--brand-50); }
.roleitem .rn { font-size:13px; font-weight:700; }
.roleitem .rd { font-size:10.5px; color:var(--t3); margin-top:1px; }

/* 底部导航 */
.mtab { flex-shrink:0; display:flex; background:#fff; border-top:1px solid var(--line); padding:6px 4px calc(8px + env(safe-area-inset-bottom)); }
.mtab .ti { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--t3); cursor:pointer; padding:3px 0; border-radius:8px; }
.mtab .ti .ic { font-size:19px; line-height:1; }
.mtab .ti.on { color:var(--brand-600); font-weight:700; }
.mtab .ti.on .ic { transform:translateY(-1px); }

.mb2 { margin-bottom:9px; }
.mt2 { margin-top:9px; }
.opb-more { display:block; width:100%; border:1px solid var(--line-strong); background:#fff; border-radius:9px; padding:12px 12px; font-size:12.5px; color:var(--t2); text-align:center; line-height:1.5; cursor:pointer; }
.opb-more:hover { border-color:var(--brand-500); color:var(--brand-600); }

/* 迭代22：访前准备看板（与 PC 端一致结构） */
.opb-hero { display:flex; justify-content:space-between; align-items:center; gap:10px; background:linear-gradient(115deg,#FDF7F8,#FCF0F1 55%,#FBEBED); border:1px solid #F3D3D6; border-radius:13px; padding:14px 15px; }
.opb-hero .ey { font-size:10px; letter-spacing:2px; color:#B4525B; }
.opb-hero h2 { font-size:16.5px; font-weight:800; margin:4px 0 5px; }
.opb-hero .sb { font-size:11px; color:var(--t2); line-height:1.7; }
.opb-verdict { flex-shrink:0; background:#fff; color:var(--brand-600); border-radius:11px; padding:8px 12px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.opb-verdict .lv { font-size:15px; font-weight:800; }
.opb-verdict .sm { font-size:9.5px; color:var(--t3); }
.opb-kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.opb-kpi { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 6px; text-align:center; border-top:2.5px solid #DBA0A6; }
.opb-kpi .k { font-size:9.5px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.opb-kpi .v { font-size:15px; font-weight:800; color:var(--brand-600); margin-top:1px; }
.opb-sec { display:flex; align-items:center; gap:7px; margin:14px 0 8px; }
.opb-sec .no { width:22px; height:22px; border-radius:7px; background:var(--brand-50); border:1px solid #F3D3D6; color:var(--brand-600); font-weight:800; font-size:11.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.opb-sec b { font-size:13.5px; }
.opb-cloud { display:flex; flex-wrap:wrap; gap:7px; }
.opb-cl { border-radius:14px; padding:3.5px 11px; font-size:11px; font-weight:600; }
.opb-cl.a { background:var(--brand-50); color:var(--brand-600); border:1px solid #F3D3D6; }
.opb-cl.b { background:#F2F6FF; color:#1A44D6; border:1px solid #D9E4FB; }
.opb-cl.c { background:#EDF7F2; color:#0F6E56; border:1px solid #D4EEE4; }
.opb-cl.e { background:var(--danger-50); color:var(--danger-500); border:1px solid #F6D7D8; }
.opb-biz { border-radius:10px; padding:10px 12px; background:#fff; border:1px solid var(--line); }
.opb-biz .t { font-size:12.5px; font-weight:800; margin-bottom:3px; }
.opb-biz .s { font-size:11px; color:var(--t2); line-height:1.65; }
.opb-person { background:#fff; border:1px solid var(--line); border-top:3px solid #DBA0A6; border-radius:10px; padding:11px 13px; }
.opb-person .nm { font-size:14px; font-weight:800; }
.opb-person .rl { font-size:11px; color:var(--brand-600); font-weight:700; margin:2px 0 4px; }
.opb-person .pt { font-size:11.5px; color:var(--t2); line-height:1.7; }
.opb-topic { background:#fff; border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
.opb-topic .hd { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
.opb-topic .no2 { min-width:21px; height:21px; border-radius:7px; color:#fff; font-weight:800; font-size:10.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.opb-topic .q { font-weight:800; font-size:12.5px; }
.opb-topic .ask { font-size:11.5px; color:var(--t2); margin:3px 0 7px; line-height:1.65; }
.opb-topic .why { background:#F8F5FC; border:1px dashed #D5CCE8; border-radius:8px; padding:7px 10px; font-size:11px; color:#4E4470; line-height:1.7; }
.opb-topic .why b { color:#5B54A8; }
.opb-topic .script { background:#F4F9FD; border-left:3px solid #2458F5; border-radius:0 8px 8px 0; padding:7px 10px; font-size:11px; color:#2A5566; margin-top:8px; line-height:1.75; }
.opb-topic .script .sl { font-weight:800; color:#1A44D6; font-size:10px; letter-spacing:.5px; display:block; margin-bottom:2px; }
.opb-note { background:var(--brand-50); border-left:3px solid var(--brand-500); border-radius:0 8px 8px 0; padding:9px 12px; font-size:11.5px; color:#5A3038; line-height:1.8; }
.opb-note b { color:var(--brand-600); }
.opb-hbar { display:flex; align-items:center; gap:8px; font-size:11.5px; padding:4px 0; }
.opb-hbar .bl { width:82px; color:var(--t2); font-weight:600; flex-shrink:0; }
.opb-hbar .bt { flex:1; height:14px; background:#F6E9EA; border-radius:5px; overflow:hidden; }
.opb-hbar .bt i { display:block; height:100%; border-radius:5px; background:#D98A92; }
.opb-hbar .bn { flex-shrink:0; color:var(--brand-600); font-weight:700; }

/* 迭代16：AI 特效 */
@keyframes mStagIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mLogIn{from{background:#FBE7E9;transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
.script-typing::after{content:"▍";color:var(--brand-500);animation:mCaret .8s steps(1) infinite}
@keyframes mCaret{50%{opacity:0}}

/* Toast */
#toast { position:absolute; left:50%; transform:translateX(-50%); bottom:86px; background:rgba(26,34,51,.92); color:#fff; padding:9px 16px; border-radius:999px; font-size:12px; display:none; z-index:99; max-width:82%; text-align:center; line-height:1.5; }

/* 选择器 */
.picker { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
.pitem { flex-shrink:0; font-size:11.5px; padding:6px 12px; border-radius:999px; background:#fff; border:1px solid var(--line-strong); color:var(--t2); }
.pitem.on { background:var(--brand-500); border-color:var(--brand-500); color:#fff; font-weight:600; }
.empty { text-align:center; padding:34px 16px; color:var(--t3); font-size:12px; }
.empty .e { font-size:30px; margin-bottom:6px; }
.opswitch { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.osw-l { display:flex; gap:0; background:#fff; border:1px solid var(--line-strong); border-radius:9px; overflow:hidden; }
.osw-i { padding:5px 12px; font-size:12px; cursor:pointer; color:var(--t2); }
.osw-i.on { background:var(--brand-500); color:#fff; font-weight:700; }
.osw-t { font-size:11px; padding:4px 10px; border-radius:999px; background:var(--blue-50,#EAF3FE); color:var(--brand-600); cursor:pointer; border:1px solid var(--line); }
.osw-t.on { background:#FFF6E8; color:#A2661A; border-color:#F2DEC0; }
#aiFab2 { position:absolute; right:14px; bottom:76px; z-index:80; width:48px; height:48px; border-radius:50%; border:none; background:linear-gradient(135deg,#6D3BF5,#0090FF); color:#fff; font-size:12px; font-weight:700; box-shadow:0 6px 18px rgba(47,70,220,.4); }
</style>
</head>
<body>
<div class="phone">
  <div class="mhead" id="mHead"></div>
  <div class="mkpis" id="mKpis"></div>
  <div class="mbody" id="mBody"></div>
  <div class="mtab" id="mTab"></div>

  renderHead(); renderBody();
  renderKpis();
  var nl=document.querySelector('.logitem'); if(nl&&S._justSaved){ nl.style.animation='mLogIn .7s both'; S._justSaved=false; }
}

/* ---------- AI 页 ---------- */
function pageAi(){
  var h='<div class="card"><div class="chat" id="chatBox">'+
    S.chat.map(function(m){ return m.q?('<div class="bub-q">'+esc(m.q)+'</div><div class="bub-a">'+m.a+(m.src?'<span class="src">来源：'+esc(m.src)+'</span>':'')+'</div>'):'<div class="bub-a">'+m.a+'</div>'; }).join('')+
  '</div>'+
  '<div class="sugs">'+D.qa.map(function(x,i){ return '<span class="sug" onclick="askAI('+i+')">'+esc(x.q)+'</span>'; }).join('')+'</div>'+
  '<div class="askrow"><input id="aiQ" placeholder="输入问题…" onkeydown="if(event.key===\'Enter\')askFree()"><button onclick="askFree()">提问</button></div></div>';
  return h;
}
function askAI(i){
  var x=D.qa[i]; S.chat.push({q:x.q,a:x.a,src:x.src}); renderBody();
  setTimeout(function(){ var b=$('#chatBox'); if (b) b.parentElement.scrollTop=1e5; var cb=$('#chatBox'); if(cb) cb.scrollIntoView({block:'end'}); },30);
}
function curCtxCo(){ var t=task(S.selTask); return t?co(t.co):null; }
function ctxAns(c, q){
  if (/注意|风险|别说/.test(q)) return '注意：'+(c.prog==='突破'?'方案窗口在近期，抓紧递交；':'以建立联系为主，不急于报价；')+'不承诺额度、利率、审批时限。';
  return '围绕「'+c.short+'」（'+c.net+' · '+c.track+'，'+c.prog+'档）：可主推 '+((c.prods||[]).slice(0,3).join('、')||'流动资金贷款')+'；非信贷先行（结算/代发）建立往来。完整建议见「准备」页。';
}
function askFree(){
  var q=$('#aiQ').value.trim(); if(!q) return;
  var ctx=curCtxCo();
  if (/这个客户|该客户/.test(q) && ctx) { S.chat.push({q:q,a:ctxAns(ctx,q)}); renderBody(); return; }
  var hit=null; D.qa.forEach(function(x){ if (!hit && (x.q.indexOf(q.slice(0,4))>=0||q.indexOf(x.q.slice(0,4))>=0)) hit=x; });
  S.chat.push({q:q,a:hit?hit.a:'已收到您的问题，建议点击下方推荐问题。',src:hit?hit.src:''});
  renderBody();
}

/* ---------- 我的页 ---------- */
function pageMy(){
  var u=user();
  return '<div class="card"><div class="sec-t">关于</div><div class="kvrow"><span class="k">平台</span><span class="v">北斗·产融智航系统 · 移动工作台</span></div>'+
  '<div class="kvrow"><span class="k">数据时点</span><span class="v">2026-11-04</span></div>'+
  '<div class="kvrow"><span class="k">功能</span><span class="v">任务 · 准备（速览/完整/外部版）· 纪要（离线可记+下次跟进）· AI助手（带客户上下文） · 跟进台账</span></div>'+
  '<div class="kvrow"><span class="k">说明</span><span class="v">停止录音后自动转写并整理归档</span></div></div>';
}
function toggleRoleSheet(){
  var mask=document.querySelector('#roleMask'), sheet=document.querySelector('#roleSheet');
  var show=sheet.style.display==='none';
  sheet.style.display=show?'block':'none'; mask.style.display=show?'block':'none';
  if(!show) return;
  sheet.innerHTML='<div style="text-align:center;font-size:11px;color:var(--t3);padding:8px 0 4px">切换角色 · 工作台内容随角色变化</div>'+
    D.users.map(function(x){
      return '<div class="roleitem '+(x.id===S.role?'on':'')+'" onclick="pickRole(\''+x.id+'\')"><div class="uav2" style="width:36px;height:36px;font-size:14px;border-radius:10px">'+esc(x.av)+'</div><div><div class="rn">'+esc(x.name)+'</div><div class="rd">'+esc(x.role)+' · '+esc(x.dept)+'</div></div>'+(x.id===S.role?'<span class="tag tag-green" style="margin-left:auto">当前</span>':'')+'</div>';
    }).join('')+
    '<div class="mbtn" style="width:100%;margin-top:6px" onclick="toggleRoleSheet()">取消</div>';
}
function pickRole(r){ toggleRoleSheet(); setRole(r); }
function setRole(r){ S.role=r; var ts=myTasks(); S.selTask=ts[0]?ts[0].id:null; S.opCo=null; renderHead(); renderTab(); renderBody();
var fab=document.createElement('button'); fab.id='aiFab2'; fab.innerHTML='✦ AI'; fab.onclick=openAiSheet; document.querySelector('.phone').appendChild(fab); toastMsg('已切换：'+user().name+'（'+user().role+'）'); }
/* 通用底部弹层（访后报告上传等复用角色切换的遮罩与容器） */
function openSheet(title, bodyHtml, footHtml){
  var mask=document.querySelector('#roleMask'), sheet=document.querySelector('#roleSheet');
  sheet.style.display='block'; mask.style.display='block';
  mask.onclick=closeSheet;
  sheet.innerHTML='<div style="font-size:14px;font-weight:700;padding:6px 4px 8px;border-bottom:1px solid var(--line)">'+title+'</div>'+
    '<div style="max-height:52vh;overflow-y:auto;padding:8px 2px">'+bodyHtml+'</div>'+
    '<div style="padding:4px 0 2px">'+footHtml+'</div>';
}
function closeSheet(){
  var mask=document.querySelector('#roleMask'), sheet=document.querySelector('#roleSheet');
  sheet.style.display='none'; mask.style.display='none';
  mask.onclick=toggleRoleSheet;
}

/* ---------- 总渲染 ---------- *//* ---------- AI 全局浮层 + 一页纸开关 ---------- */
function setOpView(v){ S.opView=v; renderBody(); }
function toggleExt(){ S.extMode=!S.extMode; renderBody(); toastMsg(S.extMode?'外部版：仅公开信息与提问清单':'内部版：完整作战信息'); }
function curCtxCo(){ var t=task(S.selTask); return t?co(t.co):null; }
function openAiSheet(){
  var c=curCtxCo();
  var head=c?'<div class="sub" style="margin-bottom:6px">当前客户：<b>'+esc(c.short)+'</b> · '+esc(c.net)+'</div><div class="sugs"><span class="sug" onclick="aiSheetAsk(\'这个客户能做什么？\')">这个客户能做什么？</span><span class="sug" onclick="aiSheetAsk(\'这个客户注意什么？\')">这个客户注意什么？</span></div>':'<div class="sub" style="margin-bottom:6px">先在任务或准备页选择客户，即可问“这个客户能做什么”。</div>';
  var body='<div style="max-height:44vh;overflow-y:auto" id="aiShChat">'+S.chat.map(function(m){ return m.q?('<div class="bub-q">'+esc(m.q)+'</div><div class="bub-a">'+m.a+'</div>'):('<div class="bub-a">'+m.a+'</div>'); }).join('')+'</div>'+
    '<div class="sugs">'+D.qa.map(function(x,i){ return '<span class="sug" onclick="aiSheetAskQA('+i+')">'+esc(x.q)+'</span>'; }).join('')+'</div>'+
    '<div class="askrow"><input id="aiShQ" placeholder="提问，或问“这个客户能做什么”…" onkeydown="if(event.key===\'Enter\')aiSheetFree()"><button onclick="aiSheetFree()">提问</button></div>';
  openSheet('✦ AI 助手'+(c?' · '+esc(c.short):''), head+body, '<button class="mbtn" style="width:100%" onclick="closeSheet()">收起</button>');
}
function aiSheetAsk(q){
  var c=curCtxCo(); var a;
  if (/这个客户|该客户/.test(q) && c) a = /注意|风险|别说/.test(q)
    ? '注意：'+(c.prog==='突破'?'方案窗口在近期，抓紧递交；':'以建立联系为主，不急于报价；')+'不承诺额度、利率、审批时限。'
    : '围绕「'+esc(c.short)+'」（'+esc(c.net)+' · '+esc(c.track)+'，'+esc(c.prog)+'档）：可主推 '+esc((c.prods||[]).slice(0,3).join('、')||'流动资金贷款')+'；非信贷先行（结算/代发）建立往来。';
  else { var hit=null; D.qa.forEach(function(x){ if(!hit&&(x.q.indexOf(q.slice(0,4))>=0||q.indexOf(x.q.slice(0,4))>=0)) hit=x; }); a=hit?hit.a:'已收到问题，结合当前客户与产品政策回答。'; }
  S.chat.push({q:q,a:a});
  var cb=document.querySelector("#aiShChat");
  if (cb) { cb.innerHTML=S.chat.map(function(m){ return m.q?('<div class="bub-q">'+esc(m.q)+'</div><div class="bub-a">'+m.a+'</div>'):('<div class="bub-a">'+m.a+'</div>'); }).join(''); cb.scrollTop=cb.scrollHeight; }
  var ip=document.querySelector("#aiShQ"); if (ip) ip.value='';
}
function aiSheetAskQA(i){ aiSheetAsk(D.qa[i].q); }
function aiSheetFree(){ var q=($("#aiShQ")||{}).value||""; q=q.trim(); if(!q){ toastMsg("请输入问题"); return; } aiSheetAsk(q); }
/* ---------- 总渲染 ---------- */
function renderBody(){
  var h='';
  if (S.tab==='task') h=pageTask();
  else if (S.tab==='op') h=pageOp();
  else if (S.tab==='visit') h=pageVisit();
  else if (S.tab==='ai') h=pageAi();
  else h=pageMy();
  $('#mBody').innerHTML=h;
  if(S.tab==='op'){ var cs=document.querySelectorAll('#mBody > *'); cs.forEach(function(e,i){ e.style.animation='mStagIn .45s both '+(i*70)+'ms'; }); }
  $('#mBody').scrollTop=0;
  var ki=document.querySelector('#tKw');
  if(ki) ki.oninput=function(){ S.kw=ki.value; renderBody(); var k2=document.querySelector('#tKw'); if(k2){ k2.focus(); k2.setSelectionRange(k2.value.length,k2.value.length);} };
}
renderHead(); renderTab(); renderBody();
</script>
</body>
</html>
