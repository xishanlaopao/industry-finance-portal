<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北斗·产融智航系统 · 北京银行南京分行 · V4</title>
  <style>
/* ============================================================
   产业金融智能平台 · 设计 Token V2（门户版）
   基调：北京银行品牌红（门户头部）+ 数据蓝（图表/链接）+ 白底内容
   换肤只改本文件
   ============================================================ */
:root {
  /* 品牌红（门户主色：头部/主按钮/栏目标题） */
  --brand-500: #C0202C;
  --brand-600: #A61521;
  --brand-700: #8E1019;
  --brand-100: #FBE7E9;
  --brand-50:  #FCF4F5;
  /* 头部渐变 */
  --hdr-grad: linear-gradient(96deg, #7E0E19 0%, #A61521 45%, #C0202C 100%);
  /* 数据蓝（链接/图表主系列） */
  --blue-500: #2458F5;  --blue-600: #1A44D6;  --blue-100: #E7EEFF;  --blue-50: #F2F6FF;
  /* 功能语义色 */
  --ok-500: #16A34A;  --ok-50:  #E8F7EE;
  --warn-500:#F59E0B; --warn-50:#FEF4E2;
  --danger-500:#E5484D; --danger-50:#FDECEC;
  --info-500:#0EA5E9;  --info-50:#E6F6FD;
  --violet-500:#7C3AED; --violet-50:#F1EAFE;
  /* 中性色 */
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --line: #E7EAF0;
  --line-strong: #D5DAE4;
  --t1: #1A2233; --t2: #5A6478; --t3: #8A93A6;
  /* 门户头部（深红）上的文字 */
  --hdr-text: #FFE3E6;
  /* 字体 */
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 26px;
  /* 圆角/阴影/间距 */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sh-sm: 0 1px 2px rgba(16,24,40,.05);
  --sh-md: 0 4px 14px rgba(16,24,40,.08);
  --sh-lg: 0 10px 32px rgba(16,24,40,.16);
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  /* 布局 */
  --pmain-w: 1680px;
  --phead-h: 64px;
  --ptop-h: 34px;
  /* 图表 */
  --chart-grid: #EDF1F7;
  --chart-label: #8A93A6;
  --chart-sec: #93A4C8;
}

</style>
  <style>
/* ============================================================
   产业金融智能平台 · 组件样式 V2（门户版 UI Kit）
   依赖 theme.tokens.css
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:var(--font); font-size:var(--fs-md); color:var(--t1); background:var(--bg); -webkit-font-smoothing:antialiased; }
a { color:var(--blue-500); text-decoration:none; }
a:hover { color:var(--blue-600); }
button { font-family:var(--font); cursor:pointer; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:#C7D0E0; border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* ============ 门户外壳 ============ */
.portal { min-height:100vh; display:flex; flex-direction:column; }
/* 顶部细条 */
.ptop { height:var(--ptop-h); background:#F2F3F6; border-bottom:1px solid var(--line); font-size:var(--fs-xs); color:var(--t2); }
.ptop-in { max-width:var(--pmain-w); margin:0 auto; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 var(--sp-5); }
.ptop .pt-links { display:flex; align-items:center; gap:16px; }
.ptop .pt-link { color:var(--t2); cursor:pointer; display:flex; align-items:center; gap:4px; }
.ptop .pt-link:hover { color:var(--brand-500); }
.ptop .pt-link .dot { width:6px; height:6px; border-radius:50%; background:var(--danger-500); }
/* 主头部 */
.phead { background:var(--hdr-grad); height:var(--phead-h); position:sticky; top:0; z-index:40; box-shadow:0 2px 10px rgba(142,16,25,.28); }
.phead-in { max-width:var(--pmain-w); margin:0 auto; height:100%; display:flex; align-items:center; gap:var(--sp-5); padding:0 var(--sp-5); }
.plogo { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.plogo .logo-mark { width:36px; height:36px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--brand-600); font-size:16px; }
.plogo .logo-name { color:#fff; font-size:17px; font-weight:700; letter-spacing:.5px; line-height:1.2; }
.plogo .logo-sub { color:var(--hdr-text); font-size:11px; margin-top:1px; }
.plogo .logo-mark { width:40px; height:40px; padding:3px; }
.plogo .logo-mark img { width:100%; height:100%; object-fit:contain; border-radius:6px; display:block; }
/* 顶部导航 */
.pnav { display:flex; align-items:center; gap:2px; height:100%; flex:1; min-width:0; }
.pnav-item { position:relative; height:100%; display:flex; align-items:center; padding:0 15px; color:var(--hdr-text); font-size:var(--fs-md); cursor:pointer; transition:.15s; white-space:nowrap; }
.pnav-item:hover { color:#fff; background:rgba(255,255,255,.09); }
.pnav-item.active { color:#fff; font-weight:600; }
.pnav-item.active::after { content:""; position:absolute; left:13px; right:13px; bottom:0; height:3px; border-radius:3px 3px 0 0; background:#fff; }
.pnav-item .n-lock { font-size:12px; opacity:.85; margin-left:3px; }
/* 头部搜索 */
.psearch { position:relative; width:300px; flex-shrink:0; }
.psearch input { width:100%; height:36px; border:none; border-radius:18px; padding:0 16px 0 38px; font-size:var(--fs-sm); outline:none; background:rgba(255,255,255,.92); color:var(--t1); font-family:var(--font); transition:.2s; }
.psearch input:focus { background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.28); }
.psearch .ps-ico { position:absolute; left:13px; top:9px; color:var(--t3); font-size:15px; }
.psearch .gs-drop { top:44px; }
.gs-drop { position:absolute; top:44px; left:0; right:0; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-lg); max-height:420px; overflow-y:auto; display:none; z-index:60; }
.gs-drop.show { display:block; }
.gs-group { font-size:11px; color:var(--t3); padding:10px 14px 4px; font-weight:600; }
.gs-item { padding:8px 14px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); color:var(--t1); }
.gs-item:hover { background:var(--blue-50); }
.gs-item .gs-tag { margin-left:auto; font-size:11px; color:var(--t3); }
/* 头部按钮区 */
.phead-acts { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.btn-ai { height:36px; padding:0 16px; border:none; border-radius:18px; background:#fff; color:var(--brand-600); font-weight:700; font-size:var(--fs-sm); display:flex; align-items:center; gap:6px; box-shadow:0 2px 8px rgba(0,0,0,.15); transition:.15s; }
.btn-ai:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.2); }
.msg-wrap { position:relative; }
.top-icon { position:relative; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:16px; }
.top-icon:hover { background:rgba(255,255,255,.14); }
.top-icon .dot { position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:#FFD34D; border:2px solid transparent; }
.msg-drop { position:absolute; top:44px; right:0; width:360px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-lg); display:none; z-index:60; }
.msg-drop.show { display:block; }
.msg-head { padding:12px 16px; font-weight:600; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.msg-item { padding:11px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; }
.msg-item:hover { background:var(--blue-50); }
.msg-item:last-child { border-bottom:none; }
.msg-item .m-dot { width:7px; height:7px; border-radius:50%; margin-top:6px; flex-shrink:0; }
.msg-item .m-title { font-size:var(--fs-sm); font-weight:500; color:var(--t1); }
.msg-item .m-time { font-size:11px; color:var(--t3); margin-top:2px; }
/* 用户区（顶条右侧） */
.user-chip { display:flex; align-items:center; gap:8px; cursor:pointer; padding:3px 8px; border-radius:8px; position:relative; }
.user-chip:hover { background:#E9EBF0; }
.avatar { width:24px; height:24px; border-radius:50%; background:var(--hdr-grad); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
.user-chip .u-name { font-size:var(--fs-xs); font-weight:600; color:var(--t1); }
.user-chip .u-role { font-size:11px; color:var(--t3); }
.dd { position:relative; }
.dd-menu { position:absolute; top:32px; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--sh-lg); min-width:190px; z-index:70; display:none; padding:6px; }
.dd-menu.show { display:block; }
.dd-item { padding:8px 12px; border-radius:7px; font-size:var(--fs-sm); cursor:pointer; display:flex; gap:8px; align-items:center; color:var(--t1); }
.dd-item:hover { background:var(--brand-50); color:var(--brand-600); }
/* 主体/面包屑/页脚 */
.pmain { max-width:var(--pmain-w); width:100%; margin:0 auto; padding:var(--sp-4) var(--sp-5) var(--sp-6); flex:1; }
.crumb-bar { font-size:var(--fs-xs); color:var(--t3); padding:6px 2px 12px; }
.crumb-bar b { color:var(--t2); font-weight:600; }
.pfoot { border-top:1px solid var(--line); background:#FAFBFC; padding:16px 0 18px; text-align:center; font-size:var(--fs-xs); color:var(--t3); line-height:1.9; }

/* ============ 首页 Hero（品牌红，与头部统一色调） ============ */
.hero { background:linear-gradient(115deg,#7E0E19 0%,#A61521 50%,#C0202C 130%); border-radius:var(--r-lg); padding:34px 38px 30px; color:#fff; position:relative; overflow:hidden; margin-bottom:var(--sp-4); box-shadow:0 6px 20px rgba(142,16,25,.25); }
.hero::after { content:""; position:absolute; right:-40px; top:-60px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%); }
.hero::before { content:""; position:absolute; right:60px; bottom:-80px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(120,0,20,.45),transparent 70%); }
.hero .h-kicker { display:inline-flex; align-items:center; gap:8px; font-size:var(--fs-xs); letter-spacing:2px; color:#FFD9DC; border:1px solid rgba(255,255,255,.3); border-radius:12px; padding:3px 12px; }
.hero .h-title { font-size:30px; font-weight:700; margin:14px 0 8px; letter-spacing:1px; }
.hero .h-sub { font-size:var(--fs-sm); color:#F5D8DB; line-height:1.8; }
.hero .h-search { display:flex; gap:10px; margin-top:20px; max-width:640px; }
.hero .h-search input { flex:1; height:44px; border:none; border-radius:22px; padding:0 20px; font-size:var(--fs-md); outline:none; font-family:var(--font); }
.hero .h-search input::placeholder { color:var(--t3); }
.hero .h-search button { height:44px; padding:0 26px; border:none; border-radius:22px; background:#fff; color:var(--brand-700); font-size:var(--fs-md); font-weight:700; transition:.15s; }
.hero .h-search button:hover { background:#FFE9EB; }
.hero .h-links { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; position:relative; z-index:2; }
.hero .h-link { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:10px; padding:8px 15px; font-size:var(--fs-sm); cursor:pointer; transition:.15s; backdrop-filter:blur(2px); }
.hero .h-link:hover { background:rgba(255,255,255,.22); }
/* 景气条 */
.boom-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:var(--sp-3); margin-bottom:var(--sp-4); }
.boom-cell { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 16px; display:flex; align-items:center; justify-content:space-between; }
.boom-cell .b-name { font-size:var(--fs-sm); color:var(--t2); font-weight:600; }
.boom-cell .b-idx { font-size:20px; font-weight:700; margin-top:2px; }
.boom-cell .b-mom { font-size:11px; font-weight:600; }
.b-up { color:var(--ok-500); } .b-down { color:var(--danger-500); }
/* 栏目标题（门户风） */
.sec-head { display:flex; align-items:center; justify-content:space-between; margin:2px 2px 12px; }
.sec-title { display:flex; align-items:center; gap:9px; font-size:var(--fs-lg); font-weight:700; }
.sec-title::before { content:""; width:4px; height:17px; border-radius:2px; background:var(--brand-500); }
.sec-title .sec-sub { font-size:var(--fs-xs); color:var(--t3); font-weight:400; margin-left:4px; }
.sec-more { font-size:var(--fs-xs); color:var(--t3); cursor:pointer; display:flex; align-items:center; gap:3px; }
.sec-more:hover { color:var(--brand-500); }
/* 首页三栏 */
.p3col { display:grid; grid-template-columns:5fr 4fr 3fr; gap:var(--sp-4); margin-bottom:var(--sp-4); }
.p2col { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); }
/* 要闻速递（时间流） */
.flash-list { padding:4px 18px 10px; }
.flash-item { display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); cursor:pointer; align-items:baseline; }
.flash-item:last-child { border-bottom:none; }
.flash-item .f-time { font-size:var(--fs-xs); color:var(--brand-500); font-weight:600; width:40px; flex-shrink:0; font-variant-numeric:tabular-nums; }
.flash-item .f-title { font-size:var(--fs-sm); line-height:1.55; color:var(--t1); }
.flash-item:hover .f-title { color:var(--brand-600); }

/* ============ 通用组件（沿用） ============ */
.card { background:var(--card); border-radius:var(--r-md); box-shadow:var(--sh-sm); border:1px solid var(--line); }
.card-pad { padding:var(--sp-4); }
.card-head { display:flex; align-items:center; justify-content:space-between; padding:14px var(--sp-4) 0; }
.card-title { font-size:var(--fs-lg); font-weight:600; display:flex; align-items:center; gap:8px; }
.card-sub { font-size:var(--fs-xs); color:var(--t3); font-weight:400; margin-left:2px; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-4); }
.kpi { background:var(--card); border-radius:var(--r-md); padding:18px var(--sp-4); border:1px solid var(--line); box-shadow:var(--sh-sm); position:relative; overflow:hidden; }
.kpi .k-label { font-size:var(--fs-sm); color:var(--t2); display:flex; align-items:center; gap:6px; }
.kpi .k-value { font-size:28px; font-weight:700; margin-top:8px; font-variant-numeric:tabular-nums; }
.kpi .k-value small { font-size:13px; font-weight:500; color:var(--t3); margin-left:2px; }
.kpi .k-foot { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:var(--fs-xs); color:var(--t3); }
.kpi .k-up { color:var(--ok-500); font-weight:600; }
.kpi .k-ico { position:absolute; right:14px; top:14px; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-4); }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-4); }
.grid-2-1 { display:grid; grid-template-columns:2fr 1fr; gap:var(--sp-4); }
.row { display:flex; gap:var(--sp-4); }
.col { display:flex; flex-direction:column; gap:var(--sp-4); }
.mb0{margin-bottom:0}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb5{margin-bottom:24px}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:24px}
.flex{display:flex;align-items:center;gap:8px}.flex-between{display:flex;align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}.flex1{flex:1;min-width:0}
.text-muted{color:var(--t3)}.text-sub{color:var(--t2)}.text-sm{font-size:var(--fs-sm)}.text-xs{font-size:var(--fs-xs)}
.fs-num{font-variant-numeric:tabular-nums}
/* 按钮 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 16px; border-radius:8px; font-size:var(--fs-sm); border:1px solid transparent; transition:.15s; white-space:nowrap; }
.btn-primary { background:var(--brand-500); color:#fff; }
.btn-primary:hover { background:var(--brand-600); }
.btn-ghost { background:var(--card); border-color:var(--line-strong); color:var(--t1); }
.btn-ghost:hover { border-color:var(--brand-500); color:var(--brand-500); }
.btn-text { color:var(--blue-500); background:none; padding:0 6px; height:auto; }
.btn-text:hover { color:var(--blue-600); }
.btn-sm { height:28px; padding:0 12px; font-size:var(--fs-xs); border-radius:6px; }
.btn-danger { background:var(--danger-500); color:#fff; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
/* 标签 */
.tag { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:4px; font-size:var(--fs-xs); font-weight:500; white-space:nowrap; }
.tag-blue   { background:var(--blue-100); color:var(--blue-600); }
.tag-green  { background:var(--ok-50); color:var(--ok-500); }
.tag-orange { background:var(--warn-50); color:#C77700; }
.tag-red    { background:var(--danger-50); color:var(--danger-500); }
.tag-violet { background:var(--violet-50); color:var(--violet-500); }
.tag-cyan   { background:var(--info-50); color:#0284C7; }
.tag-gray   { background:#F0F2F7; color:var(--t2); }
.tag-line   { background:#fff; border:1px solid var(--line-strong); color:var(--t2); }
.tag-solid-red { background:var(--brand-500); color:#fff; }
.ai-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg,#6D3BF5,#00B4FF); padding:2px 8px; border-radius:10px; letter-spacing:.5px; }
/* 页头 */
.page-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:var(--sp-4); gap:var(--sp-4); flex-wrap:wrap; }
.page-title { font-size:var(--fs-xl); font-weight:700; display:flex; align-items:center; gap:10px; }
.page-title::before { content:""; width:4px; height:19px; border-radius:2px; background:var(--brand-500); }
.page-desc { font-size:var(--fs-sm); color:var(--t2); margin-top:6px; padding-left:14px; }
/* 筛选 */
.filter-bar { display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:10px var(--sp-4); margin-bottom:var(--sp-4); }
.f-label { font-size:var(--fs-xs); color:var(--t3); margin-right:2px; }
/* 筛选条下拉多选（msel） */
.msel { position:relative; display:inline-block; }
.msel-btn { display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 10px; border:1px solid var(--line-strong); border-radius:6px; background:#fff; font-size:var(--fs-sm); color:var(--t1); cursor:pointer; max-width:260px; }
.msel-btn:hover { border-color:var(--brand-500); color:var(--brand-600); }
.msel-lab { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.msel-caret { font-size:9px; color:var(--t3); flex-shrink:0; }
.msel-panel { display:none; position:absolute; top:33px; left:0; z-index:35; min-width:190px; background:#fff; border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.22); padding:6px; }
.msel.open .msel-panel { display:block; }
.msel-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; font-size:var(--fs-sm); color:var(--t1); cursor:pointer; }
.msel-item:hover { background:var(--brand-50); }
.msel-item input { width:auto; accent-color:var(--brand-500); }
.msel-foot { display:flex; justify-content:space-between; align-items:center; padding:6px 10px 3px; border-top:1px dashed var(--line); margin-top:4px; }
/* 产业链穿透图谱节点 */
.ch-node { cursor:pointer; }
.ch-node:hover > rect { stroke:var(--brand-500) !important; stroke-width:2 !important; }
.ch-node.ch-on > rect { stroke:var(--brand-500) !important; stroke-width:2.4 !important; }

/* Toast */

.toast.t-ok::before { content:"✓"; color:#4ADE80; font-weight:700; }
.toast.t-warn::before { content:"!"; color:#FBBF24; font-weight:700; }
/* 表单 */
.form-item { margin-bottom:16px; }
.form-label { display:block; font-size:var(--fs-sm); font-weight:500; margin-bottom:6px; }

.empty .e-ico { font-size:40px; margin-bottom:10px; opacity:.5; }

/* 步骤 */
.steps { display:flex; gap:0; margin:8px 0 20px; }
.step { flex:1; text-align:center; position:relative; }
.step .s-dot { width:26px; height:26px; border-radius:50%; background:#E3E8F1; color:var(--t3); display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; position:relative; z-index:2; }

/* 报告 */
.anchor-nav { position:sticky; top:calc(var(--phead-h) + 6px); display:flex; gap:4px; flex-wrap:wrap; background:linear-gradient(180deg,var(--bg) 85%,transparent); padding:6px 0 10px; z-index:5; }

  <script>
/* ============================================================
   轻量 SVG 图表库（无外部依赖，离线可用）
   所有函数返回 HTML 字符串，插入容器即可
   ============================================================ */
window.CH = (function () {
  const GRID = 'var(--chart-grid)', LABEL = 'var(--chart-label)';

  function niceRange(min, max, zero) {
    if (zero || min <= 0 || (max - min) < max * 0.5) { min = Math.min(0, min); }
    else { min = min - (max - min) * 0.15; }
    max = max === min ? max + 1 : max + (max - min) * 0.1;
    return [min, max];
  }

  /* 折线图 series:[{name,data,color}] */
  function line(o) {
    const { labels, series, h = 230, zero = false, yFmt = v => +v.toFixed(Math.abs(v) >= 10 ? 0 : Math.abs(v) >= 1 ? 1 : 2), area = true, dots = false } = o;
    const W = 680, H = h, pl = 48, pr = 12, pt = 14, pb = 26;
    const iw = W - pl - pr, ih = H - pt - pb;
    const all = series.flatMap(s => s.data);
    let [min, max] = niceRange(Math.min(...all), Math.max(...all), zero);
    const X = i => pl + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1));
    const Y = v => pt + ih - (v - min) / (max - min) * ih;
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = min + (max - min) * i / 4, y = Y(v);
      g += `<line x1="${pl}" y1="${y}" x2="${W - pr}" y2="${y}" stroke="${GRID}" stroke-width="1"/>
            <text x="${pl - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="${LABEL}">${yFmt(v)}</text>`;
    }
    let xl = '';
    labels.forEach((l, i) => {
      if (labels.length > 10 && i % 2) return;
      xl += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="${LABEL}">${l}</text>`;
    });
    let paths = '';
    series.forEach(s => {
      const pts = s.data.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
      if (area) {
        paths += `<polygon points="${pl},${Y(min)} ${pts} ${X(s.data.length - 1)},${Y(min)}" fill="${s.color}" opacity="0.08"/>`;
      }
      paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (dots) s.data.forEach((v, i) => { paths += `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="#fff" stroke="${s.color}" stroke-width="2"/>`; });
      const li = s.data.length - 1;
      paths += `<text x="${W - 4}" y="${Y(s.data[li]) + 3}" text-anchor="end" font-size="10" fill="${s.color}" font-weight="600">${yFmt(s.data[li])}</text>`;
    });
    return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">${g}${xl}${paths}</svg></div>`;
  }

  /* 柱状图（纵向） */
  function bars(o) {
    const { labels, data, color = '#2458F5', h = 210, unit = '', max } = o;
    const W = 680, H = h, pl = 40, pr = 12, pt = 18, pb = 26;
    const iw = W - pl - pr, ih = H - pt - pb;
    const mx = max || Math.max(...data) * 1.15;
    const bw = Math.min(30, iw / data.length * 0.5);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const y = pt + ih - ih * i / 4;
      g += `<line x1="${pl}" y1="${y}" x2="${W - pr}" y2="${y}" stroke="${GRID}"/>
            <text x="${pl - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="${LABEL}">${(mx * i / 4).toFixed(mx >= 10 ? 0 : 1)}</text>`;
    }
    let barsHtml = '';
    data.forEach((v, i) => {
      const x = pl + iw / data.length * (i + 0.5) - bw / 2;
      const bh = v / mx * ih, y = pt + ih - bh;
      barsHtml += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${color}"/>
        <text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="10" fill="var(--t2)" font-weight="600">${v}${unit}</text>
        <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="${LABEL}">${labels[i]}</text>`;
    });
    return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">${g}${barsHtml}</svg></div>`;
  }

  /* 横向排名条 items:[{name,v,extra}] */
  function hbars(items, o = {}) {
    const { unit = '', color = 'var(--brand-500)', max } = o;
    const mx = max || Math.max(...items.map(i => i.v)) * 1.05;
    return items.map((it, i) => `
      <div class="rank-row">
        <span class="text-sm text-muted" style="width:118px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.pre || ''}${it.name}</span>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(it.v / mx * 100).toFixed(1)}%;${it.color ? `background:${it.color}` : ''}"></div></div>
        <span class="text-sm fs-num" style="width:72px;text-align:right;font-weight:600">${it.v}${unit}</span>
        ${it.extra ? `<span class="text-xs text-muted">${it.extra}</span>` : ''}
      </div>`).join('');
  }

  /* 环形图 */
  function donut(o) {
    const { data, size = 170, thick = 26, center, sub } = o;
    const r = (size - thick) / 2, c = size / 2, circ = 2 * Math.PI * r;
    const total = data.reduce((s, d) => s + d.v, 0);
    let off = 0, segs = '';
    data.forEach(d => {
      const len = d.v / total * circ;
      segs += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thick}"
        stroke-dasharray="${(len - 2).toFixed(1)} ${(circ - len + 2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
        transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;
      off += len;
    });
    const legend = data.map(d => `<span class="lg"><i style="background:${d.color}"></i>${d.name} <b class="fs-num">${d.v}%</b></span>`).join('');
    return `<div class="flex" style="gap:22px;align-items:center;flex-wrap:wrap">
      <div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
        <svg viewBox="0 0 ${size} ${size}" style="width:100%;height:100%">${segs}</svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-size:22px;font-weight:700">${center}</div><div class="text-xs text-muted">${sub || ''}</div>
        </div>
      </div><div class="chart-legend" style="flex-direction:column;align-items:flex-start;gap:8px">${legend}</div></div>`;
  }

  /* 雷达图 axes:[...], series:[{name,data,color}] */
  function radar(o) {
    const { axes, series, size = 240 } = o;
    const c = size / 2, R = c - 36, n = axes.length;
    const pt = (i, v) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n, r = R * v / 100;
      return [c + r * Math.cos(a), c + r * Math.sin(a)];
    };
    let rings = '';
    [25, 50, 75, 100].forEach(p => {
      const ps = axes.map((_, i) => pt(i, p).map(x => x.toFixed(1)).join(',')).join(' ');
      rings += `<polygon points="${ps}" fill="none" stroke="${GRID}"/>`;
    });
    let axis = '';
    axes.forEach((a, i) => {
      const [x, y] = pt(i, 100);
      const [lx, ly] = pt(i, 128);
      axis += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="${GRID}"/>
               <text x="${lx}" y="${ly + 3}" text-anchor="middle" font-size="10.5" fill="var(--t2)" font-weight="600">${a}</text>`;
    });
    let polys = '';
    series.forEach(s => {
      const ps = s.data.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
      polys += `<polygon points="${ps}" fill="${s.color}" fill-opacity="0.13" stroke="${s.color}" stroke-width="2"/>
        ${s.data.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x}" cy="${y}" r="2.8" fill="${s.color}"/>`; }).join('')}`;
    });
    const legend = series.map(s => `<span class="lg"><i style="background:${s.color}"></i>${s.name}</span>`).join('');
    return `<div class="flex" style="justify-content:center"><div class="chart-box" style="max-width:${size}px"><svg viewBox="0 0 ${size} ${size}">${rings}${axis}${polys}</svg></div></div>
      <div class="chart-legend" style="justify-content:center">${legend}</div>`;
  }

  /* 仪表盘（景气指数，0-150） */
  function gauge(o) {
    const { val, size = 120 } = o;
    const c = size / 2, R = c - 10, sw = 10;
    const a0 = Math.PI, a1 = 0;
    const ang = Math.PI * (1 - Math.min(val, 150) / 150);
    const x = c + R * Math.cos(ang), y = c - R * Math.sin(ang);
    const color = val >= 115 ? 'var(--ok-500)' : val >= 100 ? 'var(--brand-500)' : 'var(--warn-500)';
    return `<div style="display:flex;flex-direction:column;align-items:center">
      <div style="width:${size}px;height:${size / 2 + 14}px">
        <svg viewBox="0 0 ${size} ${size / 2 + 14}" style="width:100%">
          <path d="M ${c - R} ${c} A ${R} ${R} 0 0 1 ${c + R} ${c}" fill="none" stroke="#EDF1F7" stroke-width="${sw}" stroke-linecap="round"/>
          <path d="M ${c - R} ${c} A ${R} ${R} 0 0 1 ${x} ${y}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>
          <line x1="${c - R - 2}" y1="${c}" x2="${c - R + 4}" y2="${c}" stroke="var(--t3)" stroke-width="1.5"/>
          <text x="${c + R - 2}" y="${c + 2}" text-anchor="end" font-size="8.5" fill="var(--t3)">150</text>
          <text x="${c}" y="${c - 6}" text-anchor="middle" font-size="15" font-weight="700" fill="${color}">${val}</text>
        </svg>
      </div>
      <div class="text-xs text-muted" style="margin-top:-4px">${o.label || ''}</div></div>`;
  }

  /* 漏斗 */
  function funnel(steps, note) {
    const mx = steps[0].v;
    let html = steps.map((s, i) => {
      const w = Math.max(12, s.v / mx * 100);
      const rate = i === 0 ? '入口' : `转化率 ${(s.v / steps[i - 1].v * 100).toFixed(1)}%`;
      return `<div class="funnel-step">
        <div class="funnel-bar" style="width:${w}%;opacity:${1 - i * 0.13}">${s.n} <span style="font-weight:400;opacity:.85">${s.v}</span></div>
        <span class="funnel-rate">${rate}</span></div>`;
    }).join('');
    if (note) html += `<div class="banner b-warn mt2" style="padding:9px 12px">${note}</div>`;
    return html;
  }

  /* 迷你趋势 */
  function spark(data, o = {}) {
    const { color = 'var(--brand-500)', w = 110, h = 34 } = o;
    const mn = Math.min(...data), mx = Math.max(...data);
    const pts = data.map((v, i) => `${i / (data.length - 1) * (w - 4) + 2},${h - 3 - (v - mn) / (mx - mn || 1) * (h - 8)}`).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  }

  /* 产业链图谱（HTML 卡片链） */
  function chainMap(onSeg) {
    const chain = [
      { k: 'EDA/IP', n: 'EDA工具与IP', cnt: 26, ico: '🧩' },
      { k: '芯片设计', n: '芯片设计', cnt: 118, ico: '📐' },
      { k: '晶圆制造', n: '晶圆制造', cnt: 14, ico: '🏭' },
      { k: '封测', n: '封装测试', cnt: 36, ico: '📦' },
      { k: '应用', n: '终端应用', cnt: 210, ico: '🚗' },
    ];
    const main = chain.map((s, i) => `
      <div class="cm-node" data-seg="${s.k}" style="cursor:pointer">
        <div class="cm-ico">${s.ico}</div><div class="cm-name">${s.n}</div>
        <div class="cm-cnt">${s.cnt}家 · 本行覆盖${Math.round(s.cnt * 0.3)}家</div>
      </div>${i < chain.length - 1 ? '<div class="cm-arrow">▶</div>' : ''}`).join('');
    const support = [
      { k: '设备', n: '设备', cnt: 32, ico: '⚙️' }, { k: '材料', n: '材料', cnt: 48, ico: '🧪' },
    ].map(s => `<div class="cm-node cm-sup" data-seg="${s.k}" style="cursor:pointer">
        <div class="cm-ico">${s.ico}</div><div class="cm-name">${s.n}</div><div class="cm-cnt">${s.cnt}家</div></div>`).join('');
    return `<div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${main}</div>
      <div style="display:flex;gap:6px;margin-top:14px;align-items:center">
        <span class="text-xs text-muted" style="width:96px">支撑环节 ↓</span>${support}
        <span class="text-xs text-muted" style="margin-left:10px">设备与材料贯穿制造、封测环节（无锡区域企业数）</span>
      </div></div>`;
  }

  /* 中心辐射图谱（链式获客） */
  function networkGraph(cfg) {
    const W = 780, H = 560, cx = W / 2, cy = H / 2;
    const node = (n, x, y, main, ours) => `
      <g class="graph-node" data-net="${n.n}" transform="translate(${x},${y})">
        <circle r="${main ? 46 : 30}" fill="${ours ? '#2458F5' : main ? '#0A1B38' : '#fff'}" stroke="${ours ? '#2458F5' : main ? '#0A1B38' : '#C3CDDE'}" stroke-width="2"/>
        <text y="${main ? 5 : 4}" text-anchor="middle" font-size="${main ? 12 : 10.5}" font-weight="600" fill="${ours || main ? '#fff' : 'var(--t1)'}">${n.n.replace(/（.*）/, '')}</text>
        ${ours ? `<circle r="6" cx="26" cy="-22" fill="#16A34A" stroke="#fff" stroke-width="1.5"/>` : ''}
      </g>`;
    let links = '', nodes = '';
    cfg.up.forEach((n, i) => {
      const x = 80 + i * (W - 160) / (cfg.up.length - 1), y = 62;
      links += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#C9D4E8" stroke-width="1.4" stroke-dasharray="5 4"/>`;
      nodes += node(n, x, y, false, n.ours);
    });
    cfg.down.forEach((n, i) => {
      const x = 80 + i * (W - 160) / (cfg.down.length - 1), y = H - 62;
      links += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#C9D4E8" stroke-width="1.4"/>`;
      nodes += node(n, x, y, false, n.ours);
    });
    nodes += node(cfg.center, cx, cy, true, true);
    return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">
      ${links}${nodes}
      <text x="16" y="24" font-size="11" fill="var(--t3)">上游供应商</text>
      <text x="16" y="${H - 20}" font-size="11" fill="var(--t3)">下游客户</text>
    </svg></div>
    <div class="chart-legend"><span class="lg"><i style="background:#2458F5"></i>本行客户</span><span class="lg"><i style="background:#fff;border:1.5px solid #C3CDDE"></i>非本行客户（获客机会）</span></div>`;
  }

  /* 投资机构图谱（左右二分图） */
  function invGraph(funds, cos) {
    const W = 820, H = 60 + funds.length * 78;
    const fx = 190, cx = W - 170;
    let links = '', nodes = '';
    const coY = {}; const coList = [...new Set(funds.flatMap(f => f.invests))];
    coList.forEach((id, i) => { coY[id] = 60 + i * (H - 100) / Math.max(1, coList.length - 1); });
    funds.forEach((f, i) => {
      const y = 56 + i * 78;
      f.invests.forEach(id => {
        const cy2 = coY[id];
        links += `<path d="M ${fx + 26} ${y} C ${fx + 120} ${y}, ${cx - 120} ${cy2}, ${cx - 26} ${cy2}" fill="none" stroke="${f.tag === '国家级' ? '#E5484D' : '#93A4C8'}" stroke-width="${f.tag === '国家级' ? 2 : 1.4}" opacity=".55"/>`;
      });
      nodes += `<g class="graph-node" data-inv="${f.n}" transform="translate(${fx},${y})">
        <circle r="${18 + f.power * 0.14}" fill="${f.tag === '国家级' ? '#FDECEC' : '#F2F6FF'}" stroke="${f.tag === '国家级' ? '#E5484D' : '#2458F5'}" stroke-width="2"/>
        <text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="${f.tag === '国家级' ? '#E5484D' : '#2458F5'}">${f.power}</text>
        <text y="-34" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--t1)">${f.n}</text>
        <text y="-21" text-anchor="middle" font-size="9.5" fill="var(--t3)">${f.tag}</text>
      </g>`;
    });
    coList.forEach(id => {
      const co = cos.find(c => c.id === id), y = coY[id];
      nodes += `<g class="graph-node" data-co="${id}" transform="translate(${cx},${y})">
        <rect x="-64" y="-19" width="128" height="38" rx="10" fill="#fff" stroke="${co.status === '本行已合作' ? '#16A34A' : '#C3CDDE'}" stroke-width="1.6"/>
        <text y="-1" text-anchor="middle" font-size="11" font-weight="600" fill="var(--t1)">${co.short}</text>
        <text y="12" text-anchor="middle" font-size="9" fill="var(--t3)">${co.seg}</text>
      </g>`;
    });
    return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">${links}${nodes}
      <text x="16" y="24" font-size="11" fill="var(--t3)">投资机构（活跃度）</text>
      <text x="${cx - 40}" y="24" font-size="11" fill="var(--t3)">被投企业（名单内）</text></svg></div>
      <div class="chart-legend"><span class="lg"><i style="background:#E5484D"></i>国家级基金</span><span class="lg"><i style="background:#2458F5"></i>市场化机构</span><span class="lg"><i style="background:#16A34A;border-radius:3px"></i>边框绿色=本行客户</span></div>`;
  }

  return { line, bars, hbars, donut, radar, gauge, funnel, spark, chainMap, networkGraph, invGraph };
})();

</script>
  <script>
/* ============================================================
   应用框架 V2（门户版）：顶部导航 / 弹窗 / 抽屉 / Toast
   全局搜索 / 角色切换 / AI智能问述
   ============================================================ */
window.APP = (function () {
  const S = {
    view: 'workbench', role: 'manager', params: {}, industry: 'ic',
    newsFilter: { seg: '全部', region: '全部', etype: '全部' },
    custLayer: '全部', custStatus: '全部', custKw: '',
    oppList: null, addedCust: [], removedCust: [], inputs: [],
    reportCo: null, drill: { lv: 0, branch: null, manager: null },
    rankPeriod: '月', compareSel: ['分行营业部', '江阴支行'], capType: '全部', riskLv: '全部',
  };
  const $ = s => document.querySelector(s);

  /* ---------- 通用工具 ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const layerTag = l => `<span class="tag ${({ 龙头: 'tag-violet', 上市: 'tag-blue', 拟上市: 'tag-cyan', 储备: 'tag-gray' })[l] || 'tag-gray'}">${l}</span>`;
  const statusTag = s => `<span class="tag ${({ 本行已合作: 'tag-green', 潜在: 'tag-blue', 攻坚: 'tag-orange', 流失预警: 'tag-red' })[s] || 'tag-gray'}">${s}</span>`;
  const riskTag = l => `<span class="tag ${l === '红' ? 'tag-red' : l === '橙' ? 'tag-orange' : 'tag-gray'}" style="${l === '黄' ? 'background:var(--warn-50);color:#C77700' : ''}">${l}级</span>`;
  const segTag = s => `<span class="tag tag-line">${s}</span>`;
  function scoreRing(score, sz = 36) {
    const cls = score >= 85 ? 'score-a' : score >= 70 ? 'score-b' : 'score-c';
    return `<span class="score-ring ${cls}" style="width:${sz}px;height:${sz}px;font-size:${sz * 0.34}px">${score}</span>`;
  }
  function aiPanel(title, html) {
    return `<div class="ai-panel"><div class="ai-head"><span class="ai-badge">AI</span>${esc(title)}</div><div class="ai-body">${html}</div></div>`;
  }
  function kv(k, v, note) { return `<div class="kv"><div class="kv-k">${k}</div><div class="kv-v">${v}${note ? `<br><small>${note}</small>` : ''}</div></div>`; }

  /* ---------- Toast ---------- */
  function toast(msg, type = 'ok') {
    let w = $('.toast-wrap'); if (!w) { w = document.createElement('div'); w.className = 'toast-wrap'; document.body.appendChild(w); }
    const t = document.createElement('div'); t.className = `toast t-${type}`; t.textContent = msg; w.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 2600);
  }

  /* ---------- 弹窗 / 抽屉 / 确认 ---------- */
  function openModal(opt) {
    $('#modalBox').className = 'modal ' + (opt.wide ? 'w-lg' : opt.small ? 'w-sm' : '');
    $('#modalTitle').innerHTML = opt.title || '';
    $('#modalBody').innerHTML = opt.body || '';
    $('#modalFoot').innerHTML = opt.foot || '<button class="btn btn-ghost" onclick="APP.closeModal()">关闭</button>';
    $('#mask').classList.add('show');
    if (opt.onOpen) opt.onOpen();
  }
  function closeModal() { $('#mask').classList.remove('show'); }
  function openDrawer(title, body) {
    $('#drawerTitle').innerHTML = title; $('#drawerBody').innerHTML = body;
    $('#drawerMask').classList.add('show'); $('#drawer').classList.add('show');
  }
  function closeDrawer() { $('#drawerMask').classList.remove('show'); $('#drawer').classList.remove('show'); }
  function confirmDlg(msg, onOk) {
    openModal({ small: true, title: '操作确认', body: `<div style="line-height:1.7">${msg}</div>`,
      foot: `<button class="btn btn-ghost" onclick="APP.closeModal()">取消</button><button class="btn btn-danger" id="cfmOk">确定</button>` });
    $('#cfmOk').onclick = () => { closeModal(); onOk && onOk(); };
  }

  /* ---------- Tab 工具 ---------- */
  function renderTabs(el, tabs, active, onSwitch) {
    el.innerHTML = `<div class="tabs">${tabs.map(t => `
      <div class="tab ${t.id === active ? 'on' : ''}" data-tab="${t.id}">${esc(t.name)}${t.count != null ? ` <span class="t-count">${t.count}</span>` : ''}</div>`).join('')}</div><div class="tab-panel"></div>`;
    el.querySelectorAll('.tab').forEach(t => t.onclick = () => onSwitch(t.dataset.tab));
    return el.querySelector('.tab-panel');
  }
  function switchTab(el, tabs, active, onSwitch) {
    el.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === active));
    return el.querySelector('.tab-panel');
  }

  /* ---------- 路由 ---------- */
  function go(view, params) { Object.assign(S.params, params || {}); location.hash = '#/' + view; }
  function route() {
    const v = (location.hash || '#/workbench').replace('#/', '') || 'workbench';
    const conf = window.NAV_ITEMS[v];
    S.view = (conf ? v : 'workbench');
    if (S.view === 'cockpit' && !canCockpit()) S.view = 'workbench';
    const root = $('#viewRoot'); window.scrollTo(0, 0);
    renderNav();
    /* 非试点行业：展示专版开通进度页（平台定位：热门产业挖掘与管理） */
    if (S.industry !== 'ic') {
      const ind = window.MOCK.industryById(S.industry);
      $('#crumbBar').innerHTML = `当前位置：行业专版 <span style="margin:0 6px;color:var(--line-strong)">/</span> <b>${ind.name}</b>（${ind.status}）`;
      root.innerHTML = buildIndustryPage(ind);
      const bk = $('#indBack'); if (bk) bk.onclick = () => switchIndustry('ic');
      const iw = $('#indWant'); if (iw) iw.onclick = () => toast(`已登记「${ind.name}」行业专版开通意向，上线后将第一时间通知您`);
      return;
    }
    const view = window.VIEWS[S.view];
    $('#crumbBar').innerHTML = `当前位置：${window.NAV_ITEMS[S.view] ? `<b>${window.NAV_ITEMS[S.view].name}</b>` : ''}`;
    view.render(root);
  }
  function buildIndustryPage(ind) {
    const path = window.MOCK.industryPath;
    const curStep = ind.status === '专版建设中' ? 2 : 1;   /* 挖掘→评估→建设→运营 */
    return `<div class="card card-pad" style="max-width:860px;margin:48px auto 0;text-align:center">
      <div style="font-size:44px">🚧</div>
      <div style="font-size:var(--fs-2xl);font-weight:800;margin-top:8px">「${esc(ind.name)}」行业专版 · ${ind.status}</div>
      <div class="text-sm text-sub mt2">${esc(ind.note)}</div>

  /* ---------- AI 智能问述 ---------- */
  function aiMatch(q) {
    const m = window.MOCK;
    for (const item of m.aiQA) {
      if (item.q === q) return item;
      const segs = q.split(/[？?，,。、\s]/).filter(x => x.length >= 2);
      if (segs.some(sg => item.q.includes(sg))) return item;
      const keys = item.q.split(/[？（）()：:，,、\s]/).filter(x => x.length >= 3);
      if (keys.some(k => q.includes(k))) return item;
      /* 口语化问法：4字滑窗重合即命中 */
      for (let i = 0; i + 4 <= q.length; i++) {
        if (item.q.includes(q.slice(i, i + 4))) return item;
      }
    }
    return null;
  }
  const isMktIntent = q => /营销|建议|方案|切入|痛点|需求|规划|怎么推|如何推|如何营销|怎么合作/.test(q) || q.length > 40;

  /* ---------- AI 特效工具（迭代16：AI 思考/拉取/反馈动效） ---------- */
  const AIFX = {
    played: {},
    /* 生成流程步骤条：①解析信号→②匹配产品库→③生成模块→④测算校验，期间内容变暗 */
    flow(box) {
      return new Promise(res => {
        if (!box || box.querySelector(':scope > .ai-flow')) { res(); return; }
        const wrap = document.createElement('div'); wrap.className = 'ai-flow';
        const steps = ['解析企业信号', '匹配本行产品库', '生成方案模块', '测算与校验'];
        wrap.innerHTML = steps.map((t, i) => `<div class="ai-fstep"><span class="ic">${i + 1}</span>${t}</div>${i < steps.length - 1 ? '<span class="ai-fline"></span>' : ''}`).join('');
        box.insertBefore(wrap, box.firstChild);
        const dims = [...box.children].filter(e => e !== wrap);
        dims.forEach(e => e.classList.add('ai-dim'));
        const stEls = [...wrap.querySelectorAll('.ai-fstep')], lnEls = [...wrap.querySelectorAll('.ai-fline')];
        let i = 0;
        const tick = () => {
          if (i > 0) {
            const prev = stEls[i - 1]; prev.classList.remove('on'); prev.classList.add('done');
            prev.querySelector('.ic').textContent = '✓';
            if (lnEls[i - 1]) lnEls[i - 1].classList.add('done');
          }
          if (i >= stEls.length) { setTimeout(() => { wrap.remove(); dims.forEach(e => e.classList.remove('ai-dim')); res(); }, 300); return; }
          stEls[i].classList.add('on'); i++; setTimeout(tick, 400);
        };
        tick();
      });
    },
    /* 子块依次淡入 */
    stagger(scope) {
      if (!scope) return;
      [...scope.children].forEach((e, i) => { e.style.setProperty('--d', Math.min(i * 85, 850) + 'ms'); e.classList.add('ai-stag'); });
    },
    /* KPI 数字滚动 */
    countUp(scope) {
      if (!scope) return;
      scope.querySelectorAll('.wp-kpi .v').forEach(v => {
        const m = (v.textContent || '').match(/^(\d+(?:\.\d+)?)(.*)$/); if (!m) return;
        const n = parseFloat(m[1]), suf = m[2], dec = (m[1].split('.')[1] || '').length;
        if (!n) return;
        const t0 = performance.now(), dur = 800;
        const f = t => { const pr = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - pr, 3); v.textContent = (n * e).toFixed(dec) + suf; if (pr < 1) requestAnimationFrame(f); };
        requestAnimationFrame(f);
      });
    },
    /* 话术示范打字机（.script 内 .sl 后的文本节点逐字输出） */
    typewrite(scope) {
      if (!scope) return;
      scope.querySelectorAll('.wp-topic .script').forEach((sc, idx) => {
        const tn = [...sc.childNodes].find(nd => nd.nodeType === 3 && nd.textContent.trim().length > 10);
        if (!tn) return;
        const full = tn.textContent; tn.textContent = ''; sc.classList.add('typing');
        setTimeout(() => {
          let j = 0;
          const iv = setInterval(() => {
            tn.textContent = full.slice(0, j += 2);
            if (j >= full.length) { clearInterval(iv); sc.classList.remove('typing'); }
          }, 26);
        }, 200 + idx * 150);
      });
    },
    /* 纪要转写流式写入输入框 */
    typewriteTo(t, txt, cb) {
      t.value = ''; let j = 0;
      const iv = setInterval(() => {
        t.value = txt.slice(0, j += 2);
        if (j >= txt.length) { clearInterval(iv); t.value = txt; cb && cb(); }
      }, 22);
    },
  };

  /* ---------- 启动 ---------- */
  function boot() {
    buildSearch(); initSearch(); initMsg(); initAiPanel(); initIndustry(); renderUser();
    window.addEventListener('hashchange', route);
    if (!location.hash) location.hash = '#/workbench'; else route();
    $('#modalX').onclick = closeModal;

    $('#drawerX').onclick = closeDrawer;
    $('#drawerMask').onclick = closeDrawer;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDrawer(); $('#aiPanel').classList.remove('show'); } });
    const udd = $('#userDd'), um = $('#userMenu');
    udd.onclick = e => { e.stopPropagation(); um.classList.toggle('show'); };
    document.addEventListener('click', () => um.classList.remove('show'));
    renderUserMenu();
  }

  return { S, $, esc, layerTag, statusTag, riskTag, segTag, scoreRing, aiPanel, kv, toast,
    openModal, closeModal, openDrawer, closeDrawer, confirmDlg, renderTabs, switchTab,
    go, route, setRole, switchUser, canCockpit, switchIndustry, aiChatInit, aiAsk, openNews, openPolicy, openCompanyDrawer, boot,
    USERS, curUser: curUserMeta, role: roleMeta, AIFX };
})();

  <script>
/* ============================================================
   机会漏斗 V1：企业总览（AI筛选+导入+四维标签+自然语言筛选+订阅）
               / 订阅的企业（下发） / 任务下发与跟踪（仅已下发）
   数据：M().funnel（六张网企业库） + APP.S.fn 运行时状态

(function () {

  const POSS = ['战略', '腰部', '基础'];

  const CITIES = ['南京', '无锡', '徐州', '常州', '苏州', '南通', '连云港', '淮安', '盐城', '扬州', '镇江', '泰州', '宿迁'];
  const NET_PROD = {
    '新型电网': ['项目贷款', '绿色贷款', '供应链金融'], '新一代通信网': ['科创贷款', '并购贷款', '票据池'],
    '算力网': ['项目贷款', '科技贷', '设备更新贷'], '城市地下管网': ['项目贷', '资金监管', '债券承销'],
    '水网': ['项目贷款', '水利专项贷', '资金监管'], '物流网': ['项目贷', '供应链融资', '结算归集'],
  };
  const PROD_POOL = ['项目贷款', '流动资金贷款', '固定资产贷款', '科创e贷', '研发贷', '设备更新贷', '银团贷款', '供应链融资', '供应链票据', '票据池', '保函', '出口信贷', '跨境结算', '代发工资', '结算归集', '资金监管', '存款归集', '对公理财', '绿色贷款', '债券承销', '并购贷款', '技改贷款', '投行服务'];

  /* ---------- 标签渲染 ---------- */
  const progTag = v => ({ 突破: 'tag-solid-red', 攻坚: 'tag-orange', 培育: 'tag-blue' }[v] || 'tag-gray');
  const posTag = v => ({ 战略: 'tag-violet', 腰部: 'tag-cyan', 基础: 'tag-gray' }[v] || 'tag-gray');
  const wtTag = v => ({ 主攻: 'tag-red', 次攻: 'tag-orange', 择优: 'tag-blue', 承接: 'tag-gray' }[v] || 'tag-gray');
  const catTag = v => `<span class="text-sm">${v === '建设运营商' ? '建设运营商' : '上游供应商'}</span>`;
  const sigTag = v => `<span class="tag ${v === 'A' ? 'tag-red' : v === 'B' ? 'tag-blue' : 'tag-gray'}" style="height:19px;font-size:10px;padding:0 6px;font-weight:700">${v}</span>`;
  const srcTag = c => c.src === 'AI'
    ? `<span class="tag tag-cyan" style="height:19px;font-size:10px;padding:0 6px">✦ AI筛选</span>`
    : (c.src === 'MANUAL' || c.src === 'CLAIM')
      ? `<span class="tag tag-blue" style="height:19px;font-size:10px;padding:0 6px" title="${c.src === 'MANUAL' ? '客户经理手工录入' : '客户经理/支行主动认领'}">🙋 ${c.src === 'MANUAL' ? '手工录入' : '自认领'}</span>`
      : `<span class="tag tag-violet" style="height:19px;font-size:10px;padding:0 6px" title="导入人：${esc(c.imp.by)} · ${c.imp.d}${c.imp.note ? ' · ' + esc(c.imp.note) : ''}">📥 导入</span>`;
  const pmTag = id => (F().tags[id] || []).map(t => `<span class="tag tag-violet" style="height:17px;font-size:10px;padding:0 5px" title="${esc(t.by)} · ${t.d}"># ${esc(t.t)}</span>`).join(' ');
  const scoreBar = s => `<div class="fn-score"><b class="fs-num">${s}</b><div class="fn-score-bd"><i style="width:${s}%;background:${s >= 80 ? 'var(--brand-500)' : s >= 60 ? '#2458F5' : '#93A4C8'}"></i></div></div>`;

  /* ---------- 运行时状态 ---------- */
  function F() {
    if (!S.fn) S.fn = {
      subs: [...M().funnel.subsSeed],
      tasks: M().funnel.tasksSeed.map(t => Object.assign({}, t, { log: t.log.map(x => Object.assign({}, x)) })),
      tags: {},                /* coId -> [{t, by, d}] 产品经理备注标签 */
      f: { nets: [], track: '全部', prog: '全部', pos: '全部', wt: '全部', src: '全部', score: '全部', cat: '全部', sig: '全部', lst: '全部', rel: '全部', kw: '', acc: '全部', plist: '全部' },
      conds: [],               /* 自然语言解析出的筛选条件 chips */
      accChips: [],            /* 已选准入标准 chips（多选） */
      claims: [],              /* 客户经理/支行自认领的企业 id（留痕） */
      projSel: [],             /* 项目清单勾选 */
    };
    return S.fn;
  }
  /* 准入标准（总行/长三角两类） */
  const ACC = {
    '总行战略客户准入': { lv: '总行', cond: c => c.pos === '战略' && c.score >= 80, tip: '战略地位 + 四线得分≥80' },
    '总行科技金融白名单': { lv: '总行', cond: c => /专精特新|高新技术|小巨人/.test((c.qual || []).join('') + c.tags.join('') + c.name) || c.score >= 85, tip: '资质/高评分科技企业' },
    '长三角区域准入': { lv: '长三角', cond: c => true, tip: '苏/浙/沪/皖属地企业默认符合' },
    '长三角基建项目库': { lv: '长三角', cond: c => c.cat === '建设运营商' || /项目|基建|工程/.test(c.track), tip: '建设运营商或项目类赛道' },
  };
  /* 正负面清单 */
  const LISTS = {
    '正面清单·重大项目配套': { kind: 'pos', cond: c => (c.sig || []).join('').indexOf('重大项目') >= 0 || c.cat === '建设运营商' || c.score >= 82 },
    '正面清单·专精特新': { kind: 'pos', cond: c => /专精特新|小巨人|高新技术/.test((c.qual || []).join('') + c.tags.join('') + c.name) },
    '正面清单·上市/拟上市': { kind: 'pos', cond: c => c.listed.indexOf('是') === 0 || (c.ipo && c.ipo.length) },
    '负面清单·两高过剩产能': { kind: 'neg', cond: c => /化工|冶炼|铸造|电镀|印染/.test(c.track + c.name) },
    '负面清单·失信/涉诉预警': { kind: 'neg', cond: c => false },
  };
  const coById = id => M().funnel.cos.find(c => c.id === id);
  const rmById = id => M().funnel.rms.find(r => r.id === id);
  const taskOf = coId => F().tasks.find(t => t.co === coId);
  const tagListOf = coId => F().tags[coId] || [];
  const ROLE_KEY = () => APP.role().key;   /* rm 客户经理 / head 支行长 / pm 产品经理 / gm 负责人 */
  /* 预打标：给企业库补准入/清单命中口径（演示：命中=正面绿标，未命中负面=通过） */
  function accHit(c) { return Object.entries(ACC).filter(([k, a]) => a.cond(c)).map(([k]) => k); }
  function listHit(c) { const pos = Object.entries(LISTS).filter(([k, l]) => l.kind === 'pos' && l.cond(c)).map(([k]) => k); const neg = Object.entries(LISTS).filter(([k, l]) => l.kind === 'neg' && l.cond(c)).map(([k]) => k); return { pos, neg }; }

  /* ---------- 筛选 ---------- */
  function filteredCos() {
    const f = F().f, conds = F().conds, subs = F().subs, st = F();
    const minScore = f.score === '全部' ? 0 : +f.score.replace('+', '');
    const cv = k => { const arr = conds.filter(c => c.k === k).map(c => c.v); return arr.length ? arr : null; };
    const nlNet = cv('net'), nlCity = cv('city'), nlProg = cv('prog'), nlPos = cv('pos'), nlWt = cv('wt');
    const nlCat = cv('cat'), nlNat = cv('nat'), nlTrack = cv('track'), nlSig = cv('sig'), nlRel = cv('rel');
    const nlScore = (conds.find(c => c.k === 'score') || {}).v;
    const nlSrc = (conds.find(c => c.k === 'src') || {}).v;
    const nlSub = (conds.find(c => c.k === 'sub') || {}).v;
    const nlLst = (conds.find(c => c.k === 'lst') || {}).v;
    const nlAcc = cv('acc');      /* 自然语言：准入标准（命中其一） */
    const nlPlist = (conds.find(c => c.k === 'plist') || {}).v;  /* 自然语言：正面/负面清单 */
    /* 准入标准：多选 chips 命中其一即通过；负面清单命中任一即剔除；正面清单要求命中其一 */
    const accOk = c => (!st.accChips.length || st.accChips.some(k => ACC[k] && ACC[k].cond(c))) && (!nlAcc || nlAcc.some(k => ACC[k] && ACC[k].cond(c)));
    const lh = c => listHit(c);
    const plistOk = (v, c) => {
      if (!v || v === '正面') return !v || lh(c).pos.length > 0;
      if (v === '负面剔除') return lh(c).neg.length === 0;
      if (v === '正面·重大项目') return lh(c).pos.some(k => k.indexOf('重大项目') >= 0);
      if (v === '正面·专精特新') return lh(c).pos.some(k => k.indexOf('专精特新') >= 0);
      if (v === '正面·上市/拟上市') return lh(c).pos.some(k => k.indexOf('上市') >= 0);
      return true;
    };
    const listOk = c => plistOk(f.plist, c) && plistOk(nlPlist, c);
    return M().funnel.cos.filter(c =>
      (f.nets.length === 0 || f.nets.includes(c.net)) &&
      (f.track === '全部' || c.track === f.track) &&
      (f.prog === '全部' || c.prog === f.prog) &&
      (f.pos === '全部' || c.pos === f.pos) &&
      (f.wt === '全部' || c.wt === f.wt) &&

      (f.sig === '全部' || c.sigLv === f.sig) &&
      (f.rel === '全部' || c.rel === f.rel) &&

      (!nlCity || nlCity.includes(c.city)) &&
      (!nlProg || nlProg.includes(c.prog)) &&
      (!nlPos || nlPos.includes(c.pos)) &&
      (!nlWt || nlWt.includes(c.wt)) &&
      (!nlCat || nlCat.includes(c.cat)) &&
      (!nlNat || nlNat.some(n => c.nat.includes(n))) &&
      (!nlTrack || nlTrack.some(t => c.track.includes(t) || t.includes(c.track.split('·')[0]))) &&

      (!nlRel || nlRel.includes(c.rel)) &&

  /* ---------- 自然语言解析（关键词字典 + 剩余语义成标签） ---------- */
  const NET_KW = [
    ['新型电网', /电网|输配电|配电|变电站|变电|储能|虚拟电厂|风电|海缆|海上风电/],
    ['算力网', /算力|智算|数据中心|超算|IDC|液冷|边缘计算|算电/],
    ['城市地下管网', /管网|管廊|供排水|燃气|排水|地下空间|生命线/],
    ['水网', /水网|水利|水务|原水|调水|供水/],
    ['物流网', /物流|港口|仓储|货运|航空物流|铁路|多式联运|班列|冷链/],
    ['新一代通信网', /通信|光模块|射频|毫米波|卫星|5G|6G|量子|光通信|太赫兹|光纤/],

  function parseNL(qRaw) {

    PROGS.forEach(p => { if (q.includes(p) || (p === '培育' && /培养/.test(q))) { conds.push({ k: 'prog', v: p }); eat(p === '培育' ? /培育|培养/g : new RegExp(p, 'g')); } });
    POSS.forEach(p => { if (q.includes(p)) { conds.push({ k: 'pos', v: p }); eat(new RegExp(p, 'g')); } });
    WTS.forEach(w => { if (q.includes(w)) { conds.push({ k: 'wt', v: w }); eat(new RegExp(w, 'g')); } });
    CATS.forEach(c2 => { if (q.includes(c2)) { conds.push({ k: 'cat', v: c2 }); eat(new RegExp(c2, 'g')); } });
    [['央企', '央企'], [/国企|国资/, '国企'], ['民营', '民营'], ['外资', '外资']].forEach(([re, v]) => {
      if ((re instanceof RegExp ? re.test(q) : q.includes(re)) && !conds.some(c => c.k === 'nat' && c.v === v)) { conds.push({ k: 'nat', v }); eat(new RegExp(re instanceof RegExp ? re.source : re, 'g')); }
    });
    if (/上市/.test(q)) { conds.push({ k: 'lst', v: '上市' }); eat(/上市公司?/g); }
    if (/以上/.test(q)) { const m = q.match(/评分?\s*(\d{2,3})\s*分?\s*以上/); if (m) { conds.push({ k: 'score', v: +m[1] }); eat(new RegExp('评分?\\s*\\d{2,3}\\s*分?\\s*以上', 'g')); } }
    if (/导入|手工|手工添加/.test(q)) { conds.push({ k: 'src', v: 'IMP' }); eat(/导入|手工|手工添加/g); }
    if (/AI筛选|网上筛选|网络筛选|AI发现/.test(q)) { conds.push({ k: 'src', v: 'AI' }); eat(/AI筛选|网上筛选|网络筛选|AI发现/g); }
    if (/订阅/.test(q)) { conds.push({ k: 'sub', v: 1 }); eat(/订阅/g); }
    RELS.forEach(r2 => { if (q.includes(r2)) { conds.push({ k: 'rel', v: r2 }); eat(new RegExp(r2, 'g')); } });
    /* 准入标准与正负面清单（支持"总行正面清单/长三角准入/负面剔除"等口语） */

      const kw = a.replace(/^总行|^长三角/, '');

    if (/专精特新/.test(q) && !conds.some(c => c.k === 'plist')) { conds.push({ k: 'plist', v: '正面·专精特新' }); }
    if (/项目/.test(q)) { conds.push({ k: 'proj', v: 1 }); eat(/项目清单|项目/g); }

    return conds;

      const P = APP.S.params;

      const pageRows = feed.slice((pg - 1) * PER, pg * PER);
      const pgBtns = () => {
        if (pages <= 1) return '';

        for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - pg) <= 1) win.push(i);
        let html = `<button class="pg" data-pg="prev" ${pg === 1 ? 'disabled' : ''}>‹</button>`;
        win.forEach((i, idx) => { if (idx > 0 && i - win[idx - 1] > 1) html += '<span style="padding:0 2px;color:var(--t3)">…</span>'; html += `<button class="pg ${i === pg ? 'on' : ''}" data-pg="${i}">${i}</button>`; });
        html += `<button class="pg" data-pg="next" ${pg === pages ? 'disabled' : ''}>›</button>`;
        return html;
      };
      box.innerHTML = `
        <div class="news-layout">
          <aside class="ns-side">
            <div class="ns-g">分类</div>
            ${CATS.map(c => `<div class="ns-i ${P.cat === c ? 'on' : ''}" data-cat="${c}">${c}<span style="display:flex;align-items:center">${counts[c] !== undefined ? `<span class="ns-c">${counts[c]}</span>` : ''}${c === '产业资讯' ? `<span class="ns-caret" data-caret="1">${indOpen ? '▾' : '▸'}</span>` : ''}</span></div>` +
              (c === '产业资讯' && indOpen ? ['全部行业', ...m.industries.map(x => x.name), '其他行业'].map(i => `<div class="ns-i sub ${(P.ind || '全部行业') === i ? 'on' : ''}" data-ind="${i}">${i}</div>`).join('') : '')).join('')}

            ${[['0', '全部时间'], ['7', '近一周'], ['30', '近一月']].map(([v, t]) => `<div class="ns-i ${String(P.days || 0) === v ? 'on' : ''}" data-days="${v}">${t}</div>`).join('')}
          </aside>
          <div>
            <div class="ns-toolbar">
              <input class="input" id="nsKw" placeholder="搜索标题 / 关键词…" value="${esc(P.kw || '')}" style="width:240px;height:32px">
              <span class="text-xs text-muted">共 ${feed.length} 条 · 每页 ${PER} 条 · 按时间倒序</span>
            </div>
            <div class="card">
              ${pageRows.map(f => newsRow2(f)).join('') || `<div class="empty" style="padding:48px 20px"><div class="e-ico">🔍</div><div class="e-title">当前筛选条件下暂无动态</div></div>`}
              <div class="pager" style="padding:12px 16px">共 ${feed.length} 条 · ${pg}/${pages} 页${pgBtns()}</div>
            </div>
          </div>
        </div>`;
      box.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => { P.cat = el.dataset.cat; if (P.cat !== '产业资讯') P.ind = '全部行业'; else P.indOpen = true; P.pg = 1; this.paintMain(box); });
      /* 下拉按钮：仅展开/收起行业筛选，不改变当前分类 */
      box.querySelectorAll('[data-caret]').forEach(el => el.onclick = e => { e.stopPropagation(); P.indOpen = !indOpen; this.paintMain(box); });
      box.querySelectorAll('[data-ind]').forEach(el => el.onclick = () => { P.ind = el.dataset.ind; P.pg = 1; this.paintMain(box); });
      box.querySelectorAll('[data-days]').forEach(el => el.onclick = () => { P.days = el.dataset.days; P.pg = 1; this.paintMain(box); });
      box.querySelectorAll('[data-pg]').forEach(el => el.onclick = () => {
        const v = el.dataset.pg;
        if (v === 'prev' && pg > 1) P.pg = pg - 1;
        else if (v === 'next' && pg < pages) P.pg = pg + 1;
        else if (!isNaN(+v)) P.pg = +v;
        else return;
        this.paintMain(box);
        document.querySelector('#newsMain').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      const kw = box.querySelector('#nsKw');
      kw.oninput = () => { P.kw = kw.value.trim(); P.pg = 1; this.paintMain(box); const k2 = box.querySelector('#nsKw'); k2.focus(); k2.setSelectionRange(k2.value.length, k2.value.length); };
    },
  };

  VIEWS.insight = VIEWS.dashboard;
})();

        const rank = b.branchRank[S.rankPeriod] || b.branchRank['月'];

          const i = rank.idx.indexOf(br.n);
          if (i < 0) return { loan: base.loan, cust: base.cust };
          const fl = base.loan ? rank.loan[i] / base.loan : 0, fc = base.cust ? rank.cust[i] / base.cust : 0;

        const bk0 = drillBox.querySelector('#bk0'), bk1 = drillBox.querySelector('#bk1');
        if (bk0) bk0.onclick = () => { S.drill = { lv: 0 }; this.paintDrillEl(drillBox); };
        if (bk1) bk1.onclick = () => { S.drill.lv = 1; this.paintDrillEl(drillBox); };
      }

    paintStruct(box) {

            <div class="flex" style="gap:6px">${['周', '月', '季', '年'].map(p => `<button class="chip ${per === p ? 'on' : ''}" data-p="${p}">${p}度</button>`).join('')}</div></div>
          ${CH.hbars(data.idx.map((n, i) => ({ name: n, v: data.loan[i], pre: `<span class="rank-pill ${i < 3 ? 'rank-' + (i + 1) : ''}" style="${i >= 3 ? 'background:#F0F2F7' : ''};margin-right:6px">${i + 1}</span>`, extra: `${data.cust[i]} 户` })), { unit: '亿' })}

        const hit = M().aiQA.find(x => x.q.includes(q.slice(0, 4)) || q.includes(x.q.slice(0, 4)));
        setTimeout(() => {
          chat.insertAdjacentHTML('beforeend', `<div class="aip-a">${hit ? hit.a + '<span class="src">来源：' + esc(hit.src) + '</span>' : '已收到您的问题，正结合六张网企业库与产品政策生成回答。'}</div>`);
          chat.scrollTop = chat.scrollHeight;
        }, 600);
        chat.scrollTop = chat.scrollHeight;
      };
      box.querySelector('#wbAiGo').onclick = () => { ask(box.querySelector('#wbAiQ').value); box.querySelector('#wbAiQ').value = ''; };
      box.querySelector('#wbAiQ').onkeydown = e => { if (e.key === 'Enter') { ask(e.target.value); e.target.value = ''; } };
      box.querySelectorAll('[data-q]').forEach(sg => sg.onclick = () => ask(sg.dataset.q));
    },
    /* ---------- 跟进台账 ---------- */
    paintLedger(el, tasks) {
      const box = el.querySelector('#wbLedger');
      const cName = id => (M().funnel.cos.find(c => c.id === id) || {}).short || '';
      const rows = [];
      tasks.forEach(t => t.log.forEach(l => rows.push(Object.assign({ co: cName(t.co), tk: t.id }, l))));
      rows.sort((a, b) => b.d.localeCompare(a.d));
      const tTag = t => ({ 访客纪要: 'tag-blue', 协同留言: 'tag-orange', 反馈: 'tag-green', 催办: 'tag-red' }[t] || 'tag-line');
      box.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th style="width:64px">日期</th><th style="width:110px">企业</th><th style="width:84px">类型</th><th style="width:110px">记录人</th><th>内容</th></tr></thead><tbody>
        ${rows.map(r2 => `<tr${S._logNew && r2 === rows[0] ? ' class="log-new"' : ''}><td class="text-sm">${r2.d}</td><td class="text-sm" style="font-weight:600">${esc(r2.co)}</td>
        <td><span class="tag ${tTag(r2.t)}" style="height:19px;font-size:10px">${esc(r2.t)}</span></td>
        <td class="text-sm">${esc(r2.by)}</td><td class="text-sm text-sub" style="white-space:normal;line-height:1.6">${esc(r2.x)}</td></tr>`).join('') ||
        '<tr><td colspan="5" class="text-sm text-muted" style="padding:20px">暂无跟进记录</td></tr>'}</tbody></table></div>`;
      S._logNew = false;
    },
  };
})();

</script>
  <script>APP.boot();</script>
</body>
</html>
